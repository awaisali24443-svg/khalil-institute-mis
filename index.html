<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIN Management System</title>
<style>
:root{--g:#095e43;--gd:#074331;--gold:#d4a017;--bg:#eef3f0;--tx:#1f2d3d;--mut:#6b7a72;--card:#fff;--red:#c62828;--line:#dde5e1;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14.5px}
[dir="rtl"] body{text-align:right}
header.top{background:var(--g);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
header.top .t{font-weight:800;font-size:16px;text-transform:uppercase;flex:1;min-width:0}
header.top .t small{display:block;font-weight:400;font-size:11.5px;opacity:.85;text-transform:none}
header.top button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
header.top button:hover{background:rgba(255,255,255,.28)}
nav.tabs{background:#fff;border-bottom:2px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto;position:sticky;top:57px;z-index:40}
nav.tabs a{padding:12px 16px;text-decoration:none;color:var(--tx);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a.on{color:var(--g);border-bottom-color:var(--g)}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:18px;margin-bottom:16px}
.card h2{font-size:17px;color:var(--g);margin-bottom:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:16px;border-top:4px solid var(--g)}
.stat .n{font-size:26px;font-weight:800;color:var(--g)}
.stat .l{font-size:13px;color:var(--mut);margin-top:2px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:#e6efe9;color:var(--gd);text-align:left;padding:9px 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
[dir="rtl"] .tbl th{text-align:right}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#f6faf7}
.btn{display:inline-block;background:var(--g);color:#fff;border:none;border-radius:9px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--gd)}
.btn.gold{background:var(--gold);color:#3a2c00}.btn.gold:hover{background:#b8890f}
.btn.red{background:var(--red)}.btn.red:hover{background:#a11f1f}
.btn.gh{background:#fff;color:var(--g);border:1.5px solid var(--g)}.btn.gh:hover{background:#e6efe9}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.frow{margin-bottom:12px}
.frow label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.frow input,.frow select,.frow textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14.5px;font-family:inherit;background:#fff;color:#1f2d3d};color:#1f2d3d
.frow input:focus,.frow select:focus{border-color:var(--g);outline:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.f2{grid-template-columns:1fr}}
.req{color:var(--red)}
.err{background:#fdecea;color:#7f1d1d;border:1px solid #f5c6c2;border-radius:9px;padding:10px 14px;margin-bottom:12px;display:none;font-size:13.5px}
.ok{background:#e6f4ec;color:var(--gd);border:1px solid #bfe3cf;border-radius:9px;padding:10px 14px;margin-bottom:12px;display:none;font-size:13.5px}
.crumbs{font-size:13px;color:var(--mut);margin-bottom:10px}.crumbs a{color:var(--g);text-decoration:none;font-weight:600}.ph{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--g)}.ph-sm{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid var(--g)}.ph-ph{width:72px;height:72px;border-radius:50%;background:var(--g);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.b-paid{background:#e6f4ec;color:var(--gd)}.b-unpaid{background:#fdecea;color:#7f1d1d}.b-partial{background:#fff8e1;color:#6b4e00}
.search{width:100%;max-width:380px;padding:10px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:14px}
.loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{background:#fff;border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.12);padding:32px 28px;width:100%;max-width:380px;text-align:center}
.logincard h1{color:var(--g);font-size:20px;margin-bottom:4px;text-transform:uppercase}
.logincard p{color:var(--mut);font-size:13px;margin-bottom:18px}
.hint{font-size:12px;color:var(--mut);margin-top:12px;background:#fff8e1;border-radius:8px;padding:8px}
#printArea{display:none}
@media print{
 body>*{display:none!important}
 #printArea{display:block!important;position:static}
 .doc{max-width:700px;margin:0 auto;font-size:14px}
 .doc h1{font-size:20px;color:#000;margin-bottom:2px}
 .doc .dh{border-bottom:3px double #000;padding-bottom:10px;margin-bottom:14px}
 .doc table{width:100%;border-collapse:collapse;margin:12px 0}
 .doc td,.doc th{border:1px solid #000;padding:7px 10px;text-align:left}
 .doc .sig{margin-top:40px;display:flex;justify-content:space-between}
 .doc .amt{font-size:20px;font-weight:800}
}
.doc-head{text-align:center;margin-bottom:6px}
.mut{color:var(--mut);font-size:13px}
.mt{margin-top:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gd);color:#fff;padding:12px 22px;border-radius:10px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:all .3s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-PK'); }
function today(){ return new Date().toISOString().slice(0,10); }
function ym(d){ return String(d).slice(0,7); }
function progName(k){ for(var i=0;i<PROGRAMS.length;i++) if(PROGRAMS[i].k===k) return PROGRAMS[i][LANG]||PROGRAMS[i].en; return k; }
function setLang(l){ LANG=l; localStorage.setItem('kin_lang',l); document.documentElement.lang = l==='ur'?'ur':'en'; document.documentElement.dir = l==='ur'?'rtl':'ltr'; render(); }
function _cyrb(str,seed){ var h1=0xdeadbeef^seed, h2=0x41c6ce57^seed; for(var i=0;i<str.length;i++){ var ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0'); }
async function sha(s){ s='kin|'+String(s); return 'c53$'+_cyrb(s,7)+_cyrb(s,99)+_cyrb(s,1234)+_cyrb(s,987654); }

/* ===== src/adapters/localstorage.js — localStorage fallback DB (same get/put/del/all/byIndex interface) ===== */
/* ---------- database (localStorage fallback when IndexedDB is blocked) ---------- */
var LS = {
  _k:function(st){ return 'kinls_'+st; },
  _seqk:function(st){ return 'kinls_seq_'+st; },
  _read:function(st){ try{ return JSON.parse(localStorage.getItem(this._k(st))||'{}'); }catch(e){ return {}; } },
  _write:function(st,o){ localStorage.setItem(this._k(st), JSON.stringify(o)); },
  _keyOf:function(st,obj){
    if(st==='students'||st==='employees') return obj.cnic;
    if(st==='users') return obj.username;
    if(st==='settings') return obj.k;
    return obj.id;
  },
  _auto:function(st){ return st==='feeHeads'||st==='challans'||st==='payments'||st==='sessions'||st==='attendance'||st==='expenses'; },
  get:async function(st,k){ var o=this._read(st), v=o[String(k)]; return v===undefined?null:v; },
  put:async function(st,obj){
    var o=this._read(st), key=this._keyOf(st,obj);
    if((key===undefined||key===null)&&this._auto(st)){
      var sq=Number(localStorage.getItem(this._seqk(st))||'0')+1;
      localStorage.setItem(this._seqk(st),String(sq));
      obj.id=sq; key=sq;
    }
    o[String(key)]=obj; this._write(st,o); return key;
  },
  del:async function(st,k){ var o=this._read(st); delete o[String(k)]; this._write(st,o); },
  all:async function(st){ var o=this._read(st); return Object.keys(o).map(function(k){return o[k];}); },
  byIndex:async function(st,idx,val){
    var all=await this.all(st);
    var f = idx==='byStudent'?'cnic':(idx==='byChallan'?'challanId':(idx==='byDate'?'date':null));
    if(!f) return [];
    return all.filter(function(r){ return String(r[f])===String(val); });
  },
  clear:async function(st){ localStorage.removeItem(this._k(st)); localStorage.removeItem(this._seqk(st)); }
};
/* ===== src/adapters/indexeddb.offline.js — IndexedDB DB adapter (get/put/del/all/byIndex) (offline variant) ===== */
/* ---------- database (IndexedDB) ---------- */
var DB = {
  db:null, backend:'idb',
  open:function(){ return new Promise(function(res,rej){
    if(DB.backend==='ls'){ res(); return; }
    var r;
    try{ r = indexedDB.open('kin_mis',3); }
    catch(e){ DB.backend='ls'; res(); return; }
    r.onupgradeneeded = function(e){
      var d = e.target.result, ov = e.oldVersion||0;
      if(ov<1){
        d.createObjectStore('students',{keyPath:'cnic'});
        d.createObjectStore('feeHeads',{keyPath:'id',autoIncrement:true});
        var ch = d.createObjectStore('challans',{keyPath:'id',autoIncrement:true});
        ch.createIndex('byStudent','cnic',{unique:false});
        var py = d.createObjectStore('payments',{keyPath:'id',autoIncrement:true});
        py.createIndex('byChallan','challanId',{unique:false});
        d.createObjectStore('settings',{keyPath:'k'});
      }
      if(ov<2){
        d.createObjectStore('sessions',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('employees',{keyPath:'cnic'});
        var at = d.createObjectStore('attendance',{keyPath:'id',autoIncrement:true});
        at.createIndex('byDate','date',{unique:false});
        d.createObjectStore('expenses',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('users',{keyPath:'username'});
      }
      if(ov<3){
        d.createObjectStore('subjects',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('timetable',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('exams',{keyPath:'id',autoIncrement:true});
        var es = d.createObjectStore('examstu',{keyPath:'id',autoIncrement:true});
        es.createIndex('byExam','examId',{unique:false});
        var mk = d.createObjectStore('marks',{keyPath:'id',autoIncrement:true});
        mk.createIndex('byExam','examId',{unique:false});
        d.createObjectStore('letters',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('hospitals',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('trainees',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('visitors',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('events',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('problems',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('cvs',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('books',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('bookissue',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('stockcats',{keyPath:'id',autoIncrement:true});
        d.createObjectStore('stock',{keyPath:'id',autoIncrement:true});
      }
    };
    r.onsuccess = function(e){ DB.db=e.target.result; res(); };
    r.onerror = function(e){
      var nm = (e.target.error&&e.target.error.name)||'';
      if(nm==='SecurityError'||nm==='UnknownError'){ DB.backend='ls'; res(); return; }
      rej(e);
    };
  });},
  store:function(n,mode){ return DB.db.transaction(n,mode||'readonly').objectStore(n); },
  all:function(n){ if(DB.backend==='ls') return LS.all(n); return new Promise(function(res,rej){ var q=DB.store(n).getAll(); q.onsuccess=function(){res(q.result||[]);}; q.onerror=rej; }); },
  get:function(n,k){ if(DB.backend==='ls') return LS.get(n,k); return new Promise(function(res,rej){ var q=DB.store(n).get(k); q.onsuccess=function(){res(q.result||null);}; q.onerror=rej; }); },
  put:function(n,v){ if(DB.backend==='ls') return LS.put(n,v); return new Promise(function(res,rej){ var q=DB.store(n,'readwrite').put(v); q.onsuccess=function(){res(q.result);}; q.onerror=rej; }); },
  del:function(n,k){ if(DB.backend==='ls') return LS.del(n,k); return new Promise(function(res,rej){ var q=DB.store(n,'readwrite').delete(k); q.onsuccess=function(){res();}; q.onerror=rej; }); },
  clear:function(n){ if(DB.backend==='ls') return LS.clear(n); return new Promise(function(res,rej){ var q=DB.store(n,'readwrite').clear(); q.onsuccess=function(){res();}; q.onerror=rej; }); },
  byIndex:function(n,idx,val){ if(DB.backend==='ls') return LS.byIndex(n,idx,val); return new Promise(function(res,rej){ var q=DB.store(n).index(idx).getAll(val); q.onsuccess=function(){res(q.result||[]);}; q.onerror=rej; }); }
};

async function setting(k,def){ var s = await DB.get('settings',k); return s ? s.v : def; }
async function setSetting(k,v){ await DB.put('settings',{k:k,v:v}); }
async function nextNo(prefix,key){ var n = Number(await setting(key,0))||0; n++; await setSetting(key,n); var y=new Date().getFullYear(); return prefix+'-'+y+'-'+String(n).padStart(4,'0'); }

/* ---------- auth ---------- */
async function ensureAuth(){
  var users = await DB.all('users');
  if(!users.length){
    var oldH = await setting('passHash', null);
    var hp = oldH || await sha('khalil123');
    await DB.put('users', {username:'admin', name:'Administrator', passHash:hp, rights:MODULES.map(function(m){return m[0];})});
    if(!oldH) await setSetting('mustChange','1');
  }
  if(!await setting('instName',null)) await setSetting('instName','Khalil Institute of Nursing & Allied Health Sciences');
}

/* ---------- shell ---------- */
var MODULES = [['dash','nav_dash'],['students','nav_stu'],['fees','nav_fee'],['hr','nav_hr'],['attendance','nav_at'],['accounts','nav_ac'],['reports','nav_rep'],['backup','nav_bak'],['settings','nav_set'],['academics','nav_acad'],['letters','nav_let'],['library','nav_lib'],['stock','nav_stock'],['office','nav_off']];
var _curUser = null;
async function curUser(){
  var u = sessionStorage.getItem('kin_user');
  if(!u) return null;
  if(_curUser && _curUser.username===u) return _curUser;
  _curUser = await DB.get('users', u);

async function render(){
  var app = document.getElementById('app');
  var h = location.hash || '#/dash';
  var u = await curUser();
  if(!u && h!=='#/login'){ location.hash='#/login'; return; }
  if(h==='#/login'){ if(u){ location.hash='#/'+((u.rights||[])[0]||'dash'); return; } app.innerHTML = vLogin(); return; }
  var r = h.replace('#/','').split('/');
  var _mod = (r[0]==='student'||r[0]==='studentform') ? 'students' : (r[0]==='collect' ? 'fees' : r[0]);
  if(!hasRight(u, _mod)){ location.hash = '#/'+((u.rights||[])[0]||'dash'); return; }
  try{
    if(r[0]==='dash') app.innerHTML = shell(await vDash(),'dash');
    else if(r[0]==='students') app.innerHTML = shell(await vStudents(r[1]||''),'students');
    else if(r[0]==='student') app.innerHTML = shell(r[1]==='new'?await vStudentForm('new'):await vStudentProfile(r[1]||''),'students');
    else if(r[0]==='studentform') app.innerHTML = shell(await vStudentForm(r[1]||'new'),'students');
    else if(r[0]==='fees') app.innerHTML = shell(await vFees(r.slice(1).join('/')),'fees');
    else if(r[0]==='hr') app.innerHTML = shell(await vHR(),'hr');
    else if(r[0]==='attendance') app.innerHTML = shell(await vAttendance(r[1]||''),'attendance');
    else if(r[0]==='accounts') app.innerHTML = shell(await vAccounts(r[1]||''),'accounts');
    else if(r[0]==='collect') app.innerHTML = shell(await vCollect(),'fees');
    else if(r[0]==='academics'){
      if(r[1]==='exam') app.innerHTML = shell(await vExamDetail(Number(r[2])),'academics');
      else if(r[1]==='marks') app.innerHTML = shell(await vMarksEntry(Number(r[2])),'academics');
      else if(r[1]==='result') app.innerHTML = shell(await vResult(Number(r[2])),'academics');
      else app.innerHTML = shell(await vAcademics(r[1]||'subjects'),'academics');
    }
    else if(r[0]==='letters') app.innerHTML = shell(await vLetters(r[1]||'new'),'letters');
    else if(r[0]==='library') app.innerHTML = shell(await vLibrary(r[1]||'books'),'library');
    else if(r[0]==='stock') app.innerHTML = shell(await vStock(r[1]||'items'),'stock');
    else if(r[0]==='office') app.innerHTML = shell(await vOffice(r[1]||'hospital'),'office');
    else if(r[0]==='reports') app.innerHTML = shell(await vReports(),'reports');
    else if(r[0]==='backup') app.innerHTML = shell(vBackup(),'backup');
    else if(r[0]==='settings') app.innerHTML = shell(await vSettings(),'settings');
    else app.innerHTML = shell(await vDash(),'dash');
  }catch(err){ app.innerHTML = shell('<div class="card"><div class="err" style="display:block">Error: '+esc(err.message||err)+'</div></div>','dash'); }
  window.scrollTo(0,0);
}

function vLogin(){
  return '<div class="loginwrap"><div class="logincard"><img src="'+LOGO+'" style="width:84px;height:84px;object-fit:contain;margin-bottom:6px" alt="logo"><h1>Khalil Institute</h1><p>'+t('app_sub')+' — '+t('login_title')+'</p>'
  +'<div class="err" id="lgErr"></div>'
  +'<form onsubmit="return doLogin(event)">'
  +'<div class="frow" style="text-align:left"><label>'+t('login_user')+'</label><input id="lgUser" autocomplete="username" dir="ltr" autofocus></div>'
  +'<div class="frow" style="text-align:left"><label>'+t('login_pass')+'</label>'+pwField('lgPass')+'</div>'
  +'<button class="btn" type="submit" style="width:100%">'+t('login_btn')+'</button></form>'
  +'<div class="hint">'+t('login_hint')+'</div></div></div>';

async function doLogin(e){
  e.preventDefault();
  try{
    var un = val('lgUser').toLowerCase(), u = un ? await DB.get('users', un) : null;
    var h = await sha(val('lgPass'));
    if(u && u.passHash && u.passHash.indexOf('c53$')!==0 && window.crypto && crypto.subtle){
      try{ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kin|'+val('lgPass')));
        var oldH=Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
        if(oldH===u.passHash){ u.passHash=h; await DB.put('users',u); }
      }catch(e){}
    }
    if(u && h === u.passHash){
      if(u.username==='admin'){
        var miss2 = MODULES.filter(function(m){ return (u.rights||[]).indexOf(m[0])<0; }).map(function(m){return m[0];});
        if(miss2.length){ u.rights=(u.rights||[]).concat(miss2); await DB.put('users',u); }
      }
      _curUser = u;
      sessionStorage.setItem('kin_user', u.username);
      var first = (u.rights||[])[0] || 'dash';
      if(await setting('mustChange','0')==='1' && u.username==='admin'){ location.hash='#/settings'; }
      else location.hash = '#/'+first;
    } else showErr('lgErr', t('login_bad'));
  }catch(err){ showErr('lgErr', 'Error: '+(err&&err.message?err.message:String(err))); }
  return false;
}

function photoPick(inp){
  var f = inp.files && inp.files[0]; if(!f) return;
  var rd = new FileReader();

    var img = new Image();
    img.onload = function(){
      var mx = 480, w = img.width, ht = img.height;
      if(w>mx||ht>mx){ var r = Math.min(mx/w, mx/ht); w=Math.round(w*r); ht=Math.round(ht*r); }
      var cv = document.createElement('canvas'); cv.width=w; cv.height=ht;
      cv.getContext('2d').drawImage(img,0,0,w,ht);
      _photoData = cv.toDataURL('image/jpeg',0.75);
      document.getElementById('phPrev').innerHTML = '<img class="ph" src="'+_photoData+'">';
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}

async function delStudent(cnic){

async function saveStudent(isNew, oldCnic){
  var d = { name:val('f_name'), father:val('f_father'), gender:val('f_gender'), dob:val('f_dob'),
    cnic:val('f_cnic').replace(/\D/g,''), phone:val('f_phone').replace(/\D/g,''), wa:val('f_wa').replace(/\D/g,''),
    email:val('f_email'), district:val('f_dist'), addr:val('f_addr'), qual:val('f_qual'), board:val('f_board'),
    marks:val('f_marks'), year:val('f_year'), program:val('f_prog'), status:val('f_status'), adm:val('f_adm')||today(),
    session:val('f_session'), roll:val('f_roll'), csys:val('f_csys'),
    sno:val('f_sno'), domicile:val('f_domicile'), ssc:val('f_ssc'), hssc:val('f_hssc'), shift:val('f_shift'),
    examReg:val('f_examreg'), duration:val('f_duration'), remarks:val('f_remarks'),
    fee:{adm:num('f_fadm'),monthly:num('f_fmon'),reg:num('f_freg'),exam:num('f_fexam'),fine:num('f_ffine'),other:num('f_fother')},
    photo:_photoData||'' };
  var bad = d.name.length<3 || d.father.length<3 || (d.gender!=='M'&&d.gender!=='F') || !/^\d{4}-\d{2}-\d{2}$/.test(d.dob)
    || d.cnic.length!==13 || !(d.phone.length===11&&d.phone.indexOf('03')===0) || (d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))
    || d.district.length<2 || d.addr.length<10 || !d.qual || !d.board || !(parseFloat(d.marks)>=0&&parseFloat(d.marks)<=100)
    || !/^\d{4}$/.test(d.year) || !d.program;
  if(bad){ showErr('stErr', t('f_bad')); return; }
  var ex = await DB.get('students', d.cnic);
  if(ex && (isNew || d.cnic!==oldCnic)){ showErr('stErr', t('f_dup')); return; }
  if(isNew && !d.roll && d.session){ d.roll = await nextRoll(d.session); }
  if(!isNew && d.cnic!==oldCnic){
    // CNIC changed: move challans/payments to new key
    var chs = await DB.byIndex('challans','byStudent',oldCnic);
    await DB.del('students', oldCnic);
    for(var i=0;i<chs.length;i++){ chs[i].cnic=d.cnic; await DB.put('challans',chs[i]);
      var ps=await DB.byIndex('payments','byChallan',chs[i].id); for(var j=0;j<ps.length;j++){ ps[j].cnic=d.cnic; await DB.put('payments',ps[j]); } }
  }
  await DB.put('students', d);
  location.hash = '#/student/'+d.cnic;
}

  for(var i=0;i<heads.length;i++) if(heads[i].id===hid) head=heads[i];
  if(!head) return;
  var m = ym(today()), students = await DB.all('students'), n=0;
  for(var j=0;j<students.length;j++){
    var s=students[j];
    if(String(s.session)!==String(sesId) || s.status!=='active' || s.program!==head.program) continue;
    var ex = await DB.byIndex('challans','byStudent',s.cnic), dup=false;
    for(var k=0;k<ex.length;k++) if(ex[k].headId===hid && ex[k].month===m && ex[k].status!=='paid') dup=true;
    if(dup) continue;
    var no = await nextNo('CH','chCounter');
    var iAmt = (s.fee && +s.fee.monthly>0) ? +s.fee.monthly : head.amount;
    await DB.put('challans',{no:no,cnic:s.cnic,headId:hid,program:head.program,title:head.title,amount:iAmt,paid:0,due:today(),status:'unpaid',created:today(),sname:s.name,kind:'fee',month:m});

  }
  toast(t('fee_gen_done')+': '+n); render();
}

function downloadFile(name,text,mime){
  var b=new Blob([text],{type:mime||'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();

function b64enc(u8){ var s=''; for(var i=0;i<u8.length;i+=8192) s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return btoa(s); }
function b64dec(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function encKey(pass,salt){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encBackup(pass){
  var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  var key=await encKey(pass,salt);
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(await backupJSON())));
  var out=new Uint8Array(28+ct.length); out.set(salt,0); out.set(iv,16); out.set(ct,28);
  return b64enc(out);
}
async function decBackup(enc,pass){
  var raw=b64dec(enc), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  var key=await encKey(pass,salt);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function importBackup(inp){
  var f=inp.files[0]; if(!f) return;
  try{
    var text=await f.text(), data=null;
    try{ data=JSON.parse(text); }catch(e){
      var pass=prompt('Backup password:'); if(!pass){ inp.value=''; return; }
      data=await decBackup(text,pass);
    }
    if(!data || !data._meta || data._meta.app!=='kin-mis') throw new Error('bad file');
    if(!confirm(t('bak_confirm'))){ inp.value=''; return; }
    var stores=['students','feeHeads','challans','payments','settings','sessions','employees','attendance','expenses','users'];
    for(var i=0;i<stores.length;i++){ await DB.clear(stores[i]); var rs=data[stores[i]]||[]; for(var j=0;j<rs.length;j++) await DB.put(stores[i],rs[j]); }
    await ensureAuth(); _stuCache={};
    showOk('bakOk',t('bak_restored'));
  }catch(err){ showErr('bakErr', 'Restore failed: '+err.message); }
  inp.value='';
}
/* google drive (lazy-loaded; needs internet + client id in settings) */
function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
var driveToken=null;
async function driveAuth(){
  var cid=(await setting('driveClientId','')).trim();
  if(!cid){ alert(t('bak_need')); go('settings'); return null; }
  if(!navigator.onLine){ alert(t('bak_offline')); return null; }
  try{
    if(!window.google) await loadScript('https://accounts.google.com/gsi/client');
    var tok=await new Promise(function(res,rej){
      try{
        var tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file',
          callback:function(r){ if(r.access_token) res(r.access_token); else rej(new Error('auth')); },
          error_callback:function(){ rej(new Error('auth')); }});
        tc.requestAccessToken();
      }catch(e){ rej(e); }
    });
    driveToken=tok;
    var el=document.getElementById('drvStat'); if(el) el.textContent='✓ Google Drive';
    return tok;
  }catch(e){ alert('Drive sign-in failed.'); return null; }
}
async function driveBackupNow(){
  var tok=driveToken||await driveAuth(); if(!tok) return;
  var pass=await setting('bakPass','');
  if(!pass){ alert('Set a backup password in Settings first.'); go('settings'); return; }
  try{
    var enc=await encBackup(pass);
    var meta={name:'kin-backup-'+today()+'.kinbak',mimeType:'application/octet-stream'};
    var fd=new FormData();
    fd.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
    var raw=b64dec(enc); fd.append('file',new Blob([raw],{type:'application/octet-stream'}));
    var r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+tok},body:fd});
    if(!r.ok) throw new Error('upload '+r.status);
    showOk('bakOk',t('bak_ok'));
  }catch(e){ showErr('bakErr','Drive upload failed: '+e.message); }
}

async function attSave(kind){
  var d = val('att_date')||today();

  for(var i=0;i<old.length;i++) if(old[i].kind===kind) await DB.del('attendance',old[i].id);
  var n=0;
  for(var ref in _attBuf){ await DB.put('attendance',{date:d,kind:kind,ref:ref,status:_attBuf[ref]}); n++; }
  toast(t('at_saved')+': '+n);
  _attBuf={};

    agg[a.ref]=agg[a.ref]||{P:0,A:0,L:0}; agg[a.ref][a.status]++; }
  var names = {};
  if(kind==='stu') await warmStuCache();
  else { var es=await DB.all('employees'); for(var j=0;j<es.length;j++) names[es[j].cnic]=es[j].name; }
  var rows = Object.keys(agg).map(function(ref){
    var nm = kind==='stu' ? stuName(ref) : (names[ref]||ref);
    var g=agg[ref], tot=g.P+g.A+g.L;

async function saveUser(oldU){

  if(!un || nm.length<3 || (!oldU && pw.length<4) || !rights.length){ showErr('usrErr', t('f_bad')); return; }
  if(!oldU && await DB.get('users',un)){ showErr('usrErr', t('f_dup')); return; }
  var u = oldU ? await DB.get('users',oldU) : {username:un};
  u.name = nm; u.rights = rights;
  if(pw) u.passHash = await sha(pw);

async function delUser(username){

}

/* ---------- quick collect ---------- */
var _qcStu = null;
async function vCollect(){
  return '<div class="card">'+crumbs([[t('nav_dash'),'#/dash'],[t('nav_fee'),'#/fees'],[t('qc_title'),null]])+'<h2>'+t('qc_title')+'</h2>'

  +'<div id="qcResults" class="mt"></div><div id="qcDues"></div></div>';
}
async function qcSearch(){
  var q = val('qc_q').toLowerCase().trim();
  if(q.length<2){ document.getElementById('qcResults').innerHTML=''; document.getElementById('qcDues').innerHTML=''; return; }
  await warmStuCache();
  var all = await DB.all('students');
  var m = all.filter(function(s){ return s.status==='active' && (s.name.toLowerCase().indexOf(q)>=0 || (s.cnic.indexOf(q)>=0 || (q.replace(/\D/g,'').length>=3 && String(s.cnic||'').replace(/\D/g,'').indexOf(q.replace(/\D/g,''))>=0)) || (s.phone||'').indexOf(q)>=0); }).slice(0,8);
  document.getElementById('qcResults').innerHTML = m.map(function(s){
    return '<button class="btn gh sm" style="margin:4px" onclick="qcPick(\''+s.cnic+'\')">'+esc(s.name)+' <span dir="ltr">'+esc(s.cnic)+'</span></button>';
  }).join('') || '<p class="mut">'+t('s_nor')+'</p>';
  document.getElementById('qcDues').innerHTML='';
}
async function qcPick(cnic){
  _qcStu = cnic;
  document.getElementById('qcResults').innerHTML='';
  var ch = await DB.byIndex('challans','byStudent',cnic);
  var dues = ch.filter(function(c){ return Number(c.amount)-Number(c.paid) > 0; });
  dues.sort(function(a,b){ return a.due<b.due?-1:1; });
  var s = await DB.get('students',cnic);
  var tot=0;
  var rows = dues.map(function(c){
    var b = Number(c.amount)-Number(c.paid); tot+=b;
    return '<tr><td><input type="checkbox" class="qc_chk" value="'+c.id+'" checked style="width:20px;height:20px"></td><td>'+esc(c.no)+'</td><td>'+esc(c.title)+'</td><td dir="ltr">'+esc(c.due)+'</td><td style="text-align:right">'+fmt(b)+'</td></tr>';
  }).join('');
  document.getElementById('qcDues').innerHTML = '<h3 class="mt">'+stuLink(s.cnic,s.name)+' — '+t('fee_dues')+': '+t('cmn_rs')+' '+fmt(tot)+'</h3>'
  +(dues.length? '<div style="overflow-x:auto"><table class="tbl"><tr><th></th><th>'+t('fee_no')+'</th><th>'+t('fee_head')+'</th><th>'+t('fee_due')+'</th><th style="text-align:right">'+t('fee_total_due')+'</th></tr>'+rows+'</table></div>'
  +'<div class="f2 mt"><div class="frow"><label>'+t('fee_method')+'</label><select id="qc_method"><option value="cash">'+t('fee_cash')+'</option><option value="bank">'+t('fee_bank')+'</option><option value="jazz">'+t('fee_jazz')+'</option><option value="easy">'+t('fee_easy')+'</option></select></div>'
  +'<div class="frow"><label>'+t('fee_type')+'</label><select id="qc_head">'+headOpts('tuition')+'</select></div></div>'
  +'<div class="frow" style="max-width:260px"><label>'+t('fee_date')+'</label><input type="date" id="qc_date" value="'+today()+'"></div>'
  +'<p class="mt"><button class="btn gold" onclick="qcCollect()">'+t('qc_collect')+'</button></p>'
  : '<p class="mut">'+t('fee_nodues')+'</p>');
}
async function qcCollect(){
  var ids = Array.prototype.slice.call(document.querySelectorAll('.qc_chk')).filter(function(c){return c.checked;}).map(function(c){return Number(c.value);});
  if(!ids.length){ toast(t('f_bad')); return; }
  var method=val('qc_method'), head=val('qc_head'), date=val('qc_date')||today(), tot=0, n=0;
  for(var i=0;i<ids.length;i++){
    var c = await DB.get('challans',ids[i]); if(!c) continue;
    var bal = Number(c.amount)-Number(c.paid); if(bal<=0) continue;
    var recNo = await nextNo('REC','recCounter');
    await DB.put('payments',{recNo:recNo,challanId:c.id,cnic:c.cnic,amount:bal,date:date,method:method,head:head,by:''});
    c.paid = Number(c.paid)+bal; c.status='paid'; await DB.put('challans',c);
    tot+=bal; n++;
  }
  toast(t('qc_done')+': '+t('cmn_rs')+' '+fmt(tot)+' ('+n+')');
  if(_qcStu) qcPick(_qcStu); else render();
}

async function saveMarks(examId){
  var e = await DB.get('exams',examId);
  var inps = document.querySelectorAll('.mk_inp');
  var mk = await DB.byIndex('marks','byExam',examId);
  var ex = {};
  mk.forEach(function(m){ ex[m.cnic+'|'+m.sid]=m; });
  for(var i=0;i<inps.length;i++){
    var cnic=inps[i].getAttribute('data-cnic'), sid=Number(inps[i].getAttribute('data-sid'));
    var v=inps[i].value.trim();
    var key=cnic+'|'+sid;
    if(v===''){ if(ex[key]) await DB.del('marks',ex[key].id); continue; }
    var obt=Number(v); if(!(obt>=0)) continue;
    // cap at total
    var tot=100; for(var j=0;j<e.subjects.length;j++) if(e.subjects[j].sid===sid) tot=e.subjects[j].marks;
    if(obt>tot) obt=tot;
    if(ex[key]){ ex[key].obt=obt; await DB.put('marks',ex[key]); }
    else await DB.put('marks',{examId:examId,cnic:cnic,sid:sid,obt:obt});
  }
  toast(t('msg_saved'));
}

async function vResult(examId){
  var e = await DB.get('exams',examId); if(!e) return '<div class="card">'+t('cmn_none')+'</div>';
  var es = await DB.byIndex('examstu','byExam',examId);
  var mk = await DB.byIndex('marks','byExam',examId);
  var subs = await DB.all('subjects');
  function subName(sid){ for(var i=0;i<subs.length;i++) if(subs[i].id===sid) return subs[i].name; return ''; }
  await warmStuCache();
  var totalMax = e.subjects.reduce(function(a,s){return a+s.marks;},0);
  var mlookup = {};
  mk.forEach(function(m){ mlookup[m.cnic+'|'+m.sid]=m.obt; });
  var res = es.map(function(x){
    var tot=0, per=e.subjects.map(function(s){ var v=mlookup[x.cnic+'|'+s.sid]; v=(v===undefined?0:v); tot+=v; return v; });
    return {cnic:x.cnic, roll:x.roll, tot:tot, per:per, pct: totalMax? Math.round(tot/totalMax*100):0};
  });
  res.sort(function(a,b){return b.tot-a.tot;});
  var rows = res.map(function(r,i){
    return '<tr><td>'+(i+1)+'</td><td>'+esc(r.roll)+'</td><td>'+stuLink(r.cnic, stuName(r.cnic))+'</td><td style="text-align:right">'+r.tot+' / '+totalMax+'</td><td style="text-align:right">'+r.pct+'%</td></tr>';
  }).join('');
  var dmcRows = res.map(function(r,i){
    var cells = r.per.map(function(v){return '<td style="text-align:right">'+v+'</td>';}).join('');
    return '<tr><td>'+(i+1)+'</td><td>'+stuLink(r.cnic, stuName(r.cnic))+'</td><td dir="ltr">'+esc(r.cnic)+'</td>'+cells+'<td style="text-align:right"><b>'+r.tot+'</b></td><td style="text-align:right">'+r.pct+'%</td></tr>';
  }).join('');
  var subHeads = e.subjects.map(function(s){return '<th style="text-align:right">'+esc(subName(s.sid))+'<br><small>'+s.marks+'</small></th>';}).join('');
  return '<div class="card">'+crumbs([[t('nav_dash'),'#/dash'],[t('nav_acad'),'#/academics'],[e.name,'#/academics/exam/'+examId],[t('ac_result'),null]])+'<h2>'+esc(e.name)+' — '+t('ac_result')+'</h2>'
  +'<p><button class="btn gh" onclick="printDMC('+examId+')">'+t('ac_printdmc')+'</button></p>'
  +'<h3 class="mt">'+t('ac_positions')+'</h3><div style="overflow-x:auto"><table class="tbl"><tr><th>#</th><th>'+t('s_roll')+'</th><th>'+t('s_name')+'</th><th style="text-align:right">'+t('ac_total')+'</th><th style="text-align:right">%</th></tr>'+rows+'</table></div>'
  +'<h3 class="mt">'+t('ac_dmc')+'</h3><div style="overflow-x:auto"><table class="tbl"><tr><th>#</th><th>'+t('s_name')+'</th><th>'+t('s_cnic')+'</th>'+subHeads+'<th style="text-align:right">'+t('ac_total')+'</th><th style="text-align:right">%</th></tr>'+dmcRows+'</table></div></div>';

async function saveLetter(){

async function compartGo(){
  var examId = Number(val('cp_ex')); if(!examId) return;
  var e = await DB.get('exams',examId);
  var es = await DB.byIndex('examstu','byExam',examId);
  var mk = await DB.byIndex('marks','byExam',examId);
  var mlookup={}; mk.forEach(function(m){ mlookup[m.cnic+'|'+m.sid]=m.obt; });
  await warmStuCache();
  var passPct = 40;
  var rows = [];
  es.forEach(function(x){
    var fails=[];
    e.subjects.forEach(function(s){
      var v=mlookup[x.cnic+'|'+s.sid]; v=(v===undefined?0:v);
      if(v < s.marks*passPct/100) fails.push(s.sid);
    });
    if(fails.length) rows.push({x:x, fails:fails});
  });
  var subs = await DB.all('subjects');
  function subName(sid){ for(var i=0;i<subs.length;i++) if(subs[i].id===sid) return subs[i].name; return ''; }
  document.getElementById('cpOut').innerHTML = '<table class="tbl"><tr><th>'+t('s_roll')+'</th><th>'+t('s_name')+'</th><th>'+t('lt_compartsub')+'</th></tr>'
  +rows.map(function(r){ return '<tr><td>'+esc(r.x.roll)+'</td><td>'+esc(stuName(r.x.cnic))+'</td><td>'+r.fails.map(subName).map(esc).join(', ')+'</td></tr>'; }).join('')
  +'</table>'+(rows.length?'':'<p class="mut">'+t('cmn_none')+'</p>');
}
async function vGrace(){
  var ex = await DB.all('exams');
  var opts = ex.map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>';}).join('');
  return '<div class="card"><h2>'+t('lt_grace')+'</h2><div class="f2"><div class="frow"><label>'+t('ac_exname')+'</label><select id="gr_ex" onchange="graceGo()">'+opts+'</select></div>'
  +'<div class="frow"><label>'+t('lt_gracemarks')+'</label><input id="gr_n" type="number" value="5" dir="ltr" onchange="graceGo()"></div></div><div id="grOut" class="mt"></div></div>';
}
async function graceGo(){
  var examId = Number(val('gr_ex')); if(!examId) return;
  var grace = Number(val('gr_n'))||0;
  var e = await DB.get('exams',examId);
  var es = await DB.byIndex('examstu','byExam',examId);
  var mk = await DB.byIndex('marks','byExam',examId);
  var mlookup={}; mk.forEach(function(m){ mlookup[m.cnic+'|'+m.sid]=m.obt; });
  await warmStuCache();
  var subs = await DB.all('subjects');
  function subName(sid){ for(var i=0;i<subs.length;i++) if(subs[i].id===sid) return subs[i].name; return ''; }
  var rows=[];
  es.forEach(function(x){
    e.subjects.forEach(function(s){
      var v=mlookup[x.cnic+'|'+s.sid]; v=(v===undefined?0:v);
      var need = Math.ceil(s.marks*0.4 - v);
      if(need>0 && need<=grace) rows.push({x:x, sid:s.sid, got:v, need:need});
    });
  });
  document.getElementById('grOut').innerHTML = '<table class="tbl"><tr><th>'+t('s_roll')+'</th><th>'+t('s_name')+'</th><th>'+t('ac_subject')+'</th><th style="text-align:right">'+t('ac_obt')+'</th><th style="text-align:right">'+t('lt_graceneed')+'</th></tr>'
  +rows.map(function(r){ return '<tr><td>'+esc(r.x.roll)+'</td><td>'+esc(stuName(r.x.cnic))+'</td><td>'+esc(subName(r.sid))+'</td><td style="text-align:right">'+r.got+'</td><td style="text-align:right">'+r.need+'</td></tr>'; }).join('')
  +'</table>'+(rows.length?'':'<p class="mut">'+t('cmn_none')+'</p>');
}

    +'<td>'+(x.status==='issued'?'<button class="btn sm" onclick="bookReturn('+x.id+')">'+t('lb_return')+'</button> ':'')+'</td></tr>';
  }).join('');
  var bOpts = bs.map(function(b){ return '<option value="'+b.id+'">'+esc(b.name)+' ('+esc(b.serial||'')+')</option>'; }).join('');
  return '<div class="card"><h2>'+t('lb_issue')+'</h2><div class="err" id="biErr"></div>'
  +'<div class="f2"><div class="frow"><label>'+t('lb_book')+'</label><select id="bi_book">'+bOpts+'</select></div><div class="frow"><label>'+t('s_cnic')+'</label><input id="bi_cnic" dir="ltr"></div></div>'
  +'<p class="mt"><button class="btn" onclick="issueBook()">'+t('lb_issueb')+'</button></p>'
  +'<div class="mt" style="overflow-x:auto"><table class="tbl"><tr><th>'+t('lb_book')+'</th><th>'+t('s_name')+'</th><th>'+t('lb_issued')+'</th><th>'+t('lb_returned')+'</th><th>'+t('of_status')+'</th><th></th></tr>'+(rows||'<tr><td colspan="6" class="mut">'+t('cmn_none')+'</td></tr>')+'</table></div></div>';
}
async function issueBook(){
  var c=val('bi_cnic').replace(/\D/g,'');
  if(c.length!==13){ showErr('biErr',t('f_cnic')); return; }
  var s=await DB.get('students',c); if(!s){ showErr('biErr',t('s_nf')); return; }
  var bid=Number(val('bi_book')); if(!bid){ showErr('biErr',t('f_bad')); return; }
  await DB.put('bookissue',{bookId:bid,cnic:c,issued:today(),returned:'',status:'issued'});
  toast(t('msg_saved')); render();
}
async function bookReturn(id){
  var x=await DB.get('bookissue',id); x.returned=today(); x.status='returned'; await DB.put('bookissue',x); render();
}
/* ===== src/pages/stock.offline.js — stock: categories + items (offline variant) ===== */
/* ================= STOCK ================= */
async function vStock(sub){
  sub = sub||'items';
  var h = '<div class="card"><div class="row">'
  +'<a class="btn'+(sub==='items'?' gold':' gh')+'" href="#/stock/items">'+t('st_items')+'</a> '
  +'<a class="btn'+(sub==='cats'?' gold':' gh')+'" href="#/stock/cats">'+t('st_cats')+'</a></div></div>';
  h += sub==='items' ? await vStockItems() : await vStockCats();
  return h;
}
async function vStockCats(){
  var cs = await DB.all('stockcats');
  var rows = cs.map(function(c){ return '<tr><td>'+esc(c.name)+'</td><td><button class="btn sm red" onclick="delStockCat('+c.id+')">×</button></td></tr>'; }).join('');
  return '<div class="card"><h2>'+t('st_cats')+'</h2><div class="err" id="scErr"></div>'
  +'<div class="frow" style="max-width:340px"><label>'+t('st_catname')+'</label><div class="row"><input id="sc_name" style="flex:1"><button class="btn" onclick="addStockCat()">'+t('cmn_add')+'</button></div></div>'
  +'<div class="mt"><table class="tbl"><tr><th>'+t('st_catname')+'</th><th></th></tr>'+(rows||'<tr><td colspan="2" class="mut">'+t('cmn_none')+'</td></tr>')+'</table></div></div>';
}
async function addStockCat(){
  var n=val('sc_name').trim(); if(n.length<2){ showErr('scErr',t('f_bad')); return; }
  await DB.put('stockcats',{name:n}); toast(t('msg_saved')); render();
}
async function delStockCat(id){ if(!confirm(t('cmn_cdel')))return; await DB.del('stockcats',id); render(); }
async function vStockItems(){
  var cs = await DB.all('stockcats');
  var items = await DB.all('stock');
  function catName(id){ for(var i=0;i<cs.length;i++) if(cs[i].id===id) return cs[i].name; return ''; }
  var rows = items.map(function(x){
    return '<tr><td>'+esc(x.item)+'</td><td>'+esc(catName(x.catId))+'</td><td style="text-align:right">'+esc(x.qty)+'</td><td dir="ltr">'+esc(x.pdate||'')+'</td><td style="text-align:right">'+fmt(x.price||0)+'</td><td><button class="btn sm red" onclick="delStock('+x.id+')">×</button></td></tr>';
  }).join('');
  var cOpts = cs.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+'</option>'; }).join('');
  return '<div class="card"><h2>'+t('st_items')+'</h2><div class="err" id="stErr"></div>'
  +'<div class="f2"><div class="frow"><label>'+t('st_item')+'</label><input id="st_item"></div><div class="frow"><label>'+t('st_cats')+'</label><select id="st_cat">'+cOpts+'</select></div></div>'
  +'<div class="f2"><div class="frow"><label>'+t('st_qty')+'</label><input id="st_qty" type="number" value="1" dir="ltr"></div><div class="frow"><label>'+t('st_pdate')+'</label><input type="date" id="st_pdate" value="'+today()+'"></div></div>'
  +'<div class="frow" style="max-width:200px"><label>'+t('st_price')+'</label><input id="st_price" type="number" dir="ltr"></div>'
  +'<p class="mt"><button class="btn" onclick="addStock()">'+t('cmn_add')+'</button></p>'
  +'<div class="mt" style="overflow-x:auto"><table class="tbl"><tr><th>'+t('st_item')+'</th><th>'+t('st_cats')+'</th><th style="text-align:right">'+t('st_qty')+'</th><th>'+t('st_pdate')+'</th><th style="text-align:right">'+t('st_price')+'</th><th></th></tr>'+(rows||'<tr><td colspan="6" class="mut">'+t('cmn_none')+'</td></tr>')+'</table></div></div>';
}
async function addStock(){
  var n=val('st_item').trim(); if(n.length<2){ showErr('stErr',t('f_bad')); return; }
  await DB.put('stock',{item:n,catId:Number(val('st_cat'))||0,qty:Number(val('st_qty'))||1,pdate:val('st_pdate')||today(),price:Number(val('st_price'))||0});
  toast(t('msg_saved')); render();
}
async function delStock(id){ if(!confirm(t('cmn_cdel')))return; await DB.del('stock',id); render(); }


</script>
