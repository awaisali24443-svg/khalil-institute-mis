<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIN Management System</title>
<style>
:root{--g:#0b6e4f;--gd:#084c38;--gold:#e8a317;--bg:#f1f5f4;--tx:#1a2b3c;--mut:#64748b;--card:#ffffff;--red:#dc2626;--line:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);--radius:14px;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14.5px}
[dir="rtl"] body{text-align:right}
header.top{background:var(--g);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
header.top .t{font-weight:800;font-size:16px;text-transform:uppercase;flex:1;min-width:0}
header.top .t small{display:block;font-weight:400;font-size:11.5px;opacity:.85;text-transform:none}
header.top button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
header.top button:hover{background:rgba(255,255,255,.28)}
nav.tabs{background:#fff;border-bottom:2px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto;position:sticky;top:57px;z-index:40}
nav.tabs a{padding:12px 16px;text-decoration:none;color:var(--tx);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a.on{color:var(--g);border-bottom-color:var(--g)}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px;border:1px solid #eef2f7}
.card h2{font-size:17px;color:var(--g);margin-bottom:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid #eef2f7;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--g),#10b981)}
.stat .n{font-size:26px;font-weight:800;color:var(--g)}
.stat .l{font-size:13px;color:var(--mut);margin-top:2px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:#e6efe9;color:var(--gd);text-align:left;padding:9px 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
[dir="rtl"] .tbl th{text-align:right}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#f6faf7}
.btn{display:inline-block;background:linear-gradient(135deg,var(--g),#0d7a56);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 2px 6px rgba(11,110,79,.25)}
.btn:hover{background:var(--gd)}
.btn.gold{background:var(--gold);color:#3a2c00}.btn.gold:hover{background:#b8890f}
.btn.red{background:var(--red)}.btn.red:hover{background:#a11f1f}
.btn.gh{background:#fff;color:var(--g);border:1.5px solid var(--g)}.btn.gh:hover{background:#e6efe9}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:12.5px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:.2px}
.frow label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.frow input,.frow select,.frow textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14.5px;font-family:inherit;background:#fff;color:#1f2d3d};color:#1f2d3d
.frow input:focus,.frow select:focus{border-color:var(--g);outline:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.f2{grid-template-columns:1fr}}
@media(max-width:640px){.f2{grid-template-columns:1fr}}
.req{color:var(--red)}
.err{background:#fdecea;color:#7f1d1d;border:1px solid #f5c6c2;border-radius:9px;padding:10px 14px;margin-bottom:12px;display:none;font-size:13.5px}
.ok{background:#e6f4ec;color:var(--gd);border:1px solid #bfe3cf;border-radius:9px;padding:10px 14px;margin-bottom:12px;display:none;font-size:13.5px}
.crumbs{font-size:13px;color:var(--mut);margin-bottom:10px}.crumbs a{color:var(--g);text-decoration:none;font-weight:600}.ph{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--g)}.ph-sm{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid var(--g)}.ph-ph{width:72px;height:72px;border-radius:50%;background:var(--g);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.b-paid{background:#e6f4ec;color:var(--gd)}.b-unpaid{background:#fdecea;color:#7f1d1d}.b-partial{background:#fff8e1;color:#6b4e00}
.search{width:100%;max-width:380px;padding:10px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:14px}
.loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{background:#fff;border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.12);padding:32px 28px;width:100%;max-width:380px;text-align:center}
.logincard h1{color:var(--g);font-size:20px;margin-bottom:4px;text-transform:uppercase}
.logincard p{color:var(--mut);font-size:13px;margin-bottom:18px}
.hint{font-size:12px;color:var(--mut);margin-top:12px;background:#fff8e1;border-radius:8px;padding:8px}
.ltabs{display:flex;background:#eef3f0;border-radius:10px;padding:4px;margin-bottom:16px;gap:4px}
.ltab{flex:1;border:none;background:transparent;padding:10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
.ltab.on{background:#fff;color:var(--g);box-shadow:0 2px 8px rgba(0,0,0,.1)}
kbd{background:#eef3f0;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 8px;font-family:inherit;font-size:12px}
/* visual polish */
.stat{transition:transform .15s}
.stat:hover{transform:translateY(-2px)}
.btn{transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.tbl tr:hover td{background:#f6faf7}
.tabs a{transition:background .15s}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:-1px;border-color:var(--g)}
#kinWrap{animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav.tabs a{position:relative}
nav.tabs a.on::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--gold);border-radius:2px}
#printArea{display:none}
@media print{
 body>*{display:none!important}
 #printArea{display:block!important;position:static}
 .doc{max-width:700px;margin:0 auto;font-size:14px}
 .doc h1{font-size:20px;color:#000;margin-bottom:2px}
 .doc .dh{border-bottom:3px double #000;padding-bottom:10px;margin-bottom:14px}
 .doc table{width:100%;border-collapse:collapse;margin:12px 0}
 .doc td,.doc th{border:1px solid #000;padding:7px 10px;text-align:left}
 .doc .sig{margin-top:40px;display:flex;justify-content:space-between}
 .doc .amt{font-size:20px;font-weight:800}
}
.doc-head{text-align:center;margin-bottom:6px}
.mut{color:var(--mut);font-size:13px}
.mt{margin-top:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gd);color:#fff;padding:12px 22px;border-radius:10px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:all .3s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- receipt book style ---------- */
.receipt-book{max-width:700px;margin:0 auto;padding:20px;border:2px solid #1a3a5c;font-family:Georgia,serif;color:#1a1a1a;background:#fff}
.rc-head{display:flex;align-items:center;justify-content:space-between;border-bottom:3px double #1a3a5c;padding-bottom:10px;margin-bottom:10px}
.rc-logo{width:70px;height:70px}
.rc-title h2{font-size:17px;text-align:center;color:#1a3a5c;margin:0;line-height:1.4;letter-spacing:.5px}
.rc-phones{font-size:12px;text-align:right;color:#1a3a5c}
.rc-bar{display:flex;align-items:center;gap:14px;margin:10px 0}
.rc-receipt{background:#1a3a5c;color:#fff;padding:5px 18px;font-weight:800;letter-spacing:2px;font-size:15px}
.rc-copy{font-style:italic;color:#555}
.rc-sno{margin-left:auto;font-size:14px}
.rc-meta{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-bottom:1px dotted #ccc}
.rc-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
.rc-table th{background:#1a3a5c;color:#fff;padding:8px;text-align:left}
.rc-table td{border:1px solid #999;padding:7px 8px}
.rc-total td{background:#f0f4f8;font-size:15px}
.rc-foot{background:#1a3a5c;color:#fff;text-align:center;font-size:12px;padding:8px;margin-top:14px}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;top:0;left:0;width:100%}
  .receipt-book{border-width:1px;box-shadow:none}
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-PK'); }
function fmtCnic(el){ var d=el.value.replace(/\D/g,'').slice(0,13); var p=[]; if(d.length>0)p.push(d.slice(0,5)); if(d.length>5)p.push(d.slice(5,12)); if(d.length>12)p.push(d.slice(12)); el.value=p.join('-'); }
function today(){ return new Date().toISOString().slice(0,10); }
function ym(d){ return String(d).slice(0,7); }
function progName(k){ for(var i=0;i<PROGRAMS.length;i++) if(PROGRAMS[i].k===k) return PROGRAMS[i][LANG]||PROGRAMS[i].en; return k; }
function setLang(l){ LANG=l; localStorage.setItem('kin_lang',l); document.documentElement.lang = l==='ur'?'ur':'en'; document.documentElement.dir = l==='ur'?'rtl':'ltr'; _shellBuilt=false; render(); }
function _cyrb(str,seed){ var h1=0xdeadbeef^seed, h2=0x41c6ce57^seed; for(var i=0;i<str.length;i++){ var ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0'); }
async function sha(s){ s='kin|'+String(s); return 'c53$'+_cyrb(s,7)+_cyrb(s,99)+_cyrb(s,1234)+_cyrb(s,987654); }

/* ===== src/adapters/localstorage.js — localStorage fallback DB (same get/put/del/all/byIndex interface) ===== */
/* ---------- database (localStorage fallback when IndexedDB is blocked) ---------- */
var LS = {
  _k:function(st){ return 'kinls_'+st; },
  _seqk:function(st){ return 'kinls_seq_'+st; },
  _read:function(st){ try{ return JSON.parse(localStorage.getItem(this._k(st))||'{}'); }catch(e){ return {}; } },
  _write:function(st,o){ localStorage.setItem(this._k(st), JSON.stringify(o)); },
  _keyOf:function(st,obj){
    if(st==='students'||st==='employees') return obj.cnic;
    if(st==='users') return obj.username;
    if(st==='settings') return obj.k;
    return obj.id;
  },
  _auto:function(st){ return st==='feeHeads'||st==='challans'||st==='payments'||st==='sessions'||st==='attendance'||st==='expenses'; },
  get:async function(st,k){ var o=this._read(st), v=o[String(k)]; return v===undefined?null:v; },
  put:async function(st,obj){
    var o=this._read(st), key=this._keyOf(st,obj);
    if((key===undefined||key===null)&&this._auto(st)){
      var sq=Number(localStorage.getItem(this._seqk(st))||'0')+1;
      localStorage.setItem(this._seqk(st),String(sq));
      obj.id=sq; key=sq;
    }
    o[String(key)]=obj; this._write(st,o); return key;
  },
  del:async function(st,k){ var o=this._read(st); delete o[String(k)]; this._write(st,o); },
  all:async function(st){ var o=this._read(st); return Object.keys(o).map(function(k){return o[k];}); },
  byIndex:async function(st,idx,val){
    var all=await this.all(st);
    var f = idx==='byStudent'?'cnic':(idx==='byChallan'?'challanId':(idx==='byDate'?'date':null));
    if(!f) return [];
    return all.filter(function(r){ return String(r[f])===String(val); });
  },
  clear:async function(st){ localStorage.removeItem(this._k(st)); localStorage.removeItem(this._seqk(st)); }
};

  _cache: {},
  _cacheTTL: 300000,
  _cget: function(t){ var c = DB._cache[t]; return (c && (Date.now()-c.ts) < DB._cacheTTL) ? c.rows : null; },
  _cset: function(t, rows){ DB._cache[t] = {ts: Date.now(), rows: rows}; },
  _cinv: function(t){ delete DB._cache[t]; },
  req: async function(method, path, body, prefer, _retried){
    var ctrl = new AbortController();
    var to = setTimeout(function(){ ctrl.abort(); }, SB.reqTimeout);
    var r;
    try{
      r = await fetch(SB.url + path, {method: method, headers: DB.hd(prefer), body: body?JSON.stringify(body):undefined, signal: ctrl.signal});
    }catch(e){
      clearTimeout(to);
      if(!_retried && (e.name==='AbortError' || e.name==='TypeError')){
        await new Promise(function(res){ setTimeout(res, 800); });
        return DB.req(method, path, body, prefer, true);
      }
      throw new Error('net');
    }
    clearTimeout(to);
    if(r.status===401 && SB.token && !_retried){
      if(await refreshSession()) return DB.req(method, path, body, prefer, true);
      throw new Error('auth');
    }
    if(r.status===401 || r.status===403){ throw new Error('auth'); }
    var txt = await r.text();
    var j = null;
    try{ j = txt ? JSON.parse(txt) : null; }catch(e){ throw new Error('bad response'); }
    if(!r.ok) throw new Error((j&&j.message)||('HTTP '+r.status));
    return j;
  },
  withId: function(row){
    var d = (row && row.data) || {};
    if(row && row.id!==undefined && d.id===undefined) d.id = row.id;
    return d;
  },
  all: async function(n){
    var t = DB.T(n);
    var hit = DB._cget(t);
    if(hit) return hit;
    var sel = DB.KEYED[n] ? 'key,data' : 'id,data';
    var out = [], off = 0;
    while(true){
      var rows = await DB.req('GET', '/rest/v1/'+t+'?select='+sel+'&limit=1000&offset='+off);
      rows = rows||[];
      for(var i=0;i<rows.length;i++) out.push(DB.withId(rows[i]));
      if(rows.length < 1000) break;
      off += 1000;
    }
    if(out.length) DB._cset(t, out);
    return out;
  },
  get: async function(n,k){
    if(k===undefined||k===null||k==='') return null;
    var q;
    if(DB.KEYED[n]) q = '/rest/v1/'+DB.T(n)+'?key=eq.'+encodeURIComponent(k)+'&select=data&limit=1';
    else if(n==='settings') q = '/rest/v1/'+DB.T(n)+'?data->>k=eq.'+encodeURIComponent(k)+'&select=data&limit=1';
    else q = '/rest/v1/'+DB.T(n)+'?id=eq.'+encodeURIComponent(k)+'&select=data&limit=1';
    var sel = DB.KEYED[n] ? 'key,data' : 'id,data';
    var rows = await DB.req('GET', q.replace('select=data','select='+sel));
    return (rows&&rows[0]) ? DB.withId(rows[0]) : null;
  },
  put: async function(n,v){
    var t = DB.T(n);
    DB._cinv(t);
    if(t==='challans'||t==='payments') invDuesMap();
    if(DB.KEYED[n]){
      await DB.req('POST', '/rest/v1/'+t, {key: v.cnic, data: v}, 'resolution=merge-duplicates');
      return v.cnic;
    }
    if(n==='settings'){
      var ex = await DB.get(n, v.k);
      if(ex) await DB.req('PATCH', '/rest/v1/'+t+'?data->>k=eq.'+encodeURIComponent(v.k), {data: v});
      else await DB.req('POST', '/rest/v1/'+t, {data: v});
      return v.k;
    }
    if(v.id){
      await DB.req('PATCH', '/rest/v1/'+t+'?id=eq.'+encodeURIComponent(v.id), {data: v});
      return v.id;
    }
    var rows = await DB.req('POST', '/rest/v1/'+t, {data: v}, 'return=representation');
    var nid = rows && rows[0] ? rows[0].id : null;
    if(nid) v.id = nid;
    return nid;
  },
  del: async function(n,k){
    var t = DB.T(n), q;
    DB._cinv(t);
    if(DB.KEYED[n]) q = '?key=eq.'+encodeURIComponent(k);
    else if(n==='settings') q = '?data->>k=eq.'+encodeURIComponent(k);
    else q = '?id=eq.'+encodeURIComponent(k);
    await DB.req('DELETE', '/rest/v1/'+t+q);
  },
  clear: async function(n){
    var t = DB.T(n);
    DB._cinv(t);
    var col = DB.KEYED[n] ? 'key' : (n==='settings' ? 'id' : 'id');
    await DB.req('DELETE', '/rest/v1/'+t+'?'+col+'=not.is.null');
  },
  byIndex: async function(n,idx,val){
    var f = DB.IDX[idx]||'cnic';
    var sel = DB.KEYED[n] ? 'key,data' : 'id,data';
    var rows = await DB.req('GET', '/rest/v1/'+DB.T(n)+'?data->>'+f+'=eq.'+encodeURIComponent(val)+'&select='+sel);
    return (rows||[]).map(DB.withId);
  }
};

function staffEmail(cnic){ return cnic.replace(/\D/g,'')+'@kin.local'; }

async function doLogin(e){
  e.preventDefault();
  var btn = document.getElementById('lgBtn');
  if(btn){ btn.disabled = true; btn.textContent = '\u2026'; }
  try{
    var cnic = val('lgCnic').replace(/\D/g,'');
    var pw = val('lgPass');
    if(cnic.length!==13){ showErr('lgErr', t('login_cnic_bad')); if(btn){btn.disabled=false;btn.textContent=t('login_btn');} return false; }
    if(!pw || pw.length<6){ showErr('lgErr', t('login_bad')); if(btn){btn.disabled=false;btn.textContent=t('login_btn');} return false; }
    // Strict matching: try student account first, then staff account
    // Each requires EXACT CNIC+password match - no bypass
    var emails = [studentEmail(cnic), staffEmail(cnic)];
    var j = null, loginEmail = null;
    for(var i=0;i<emails.length;i++){
      try{
        var r = await fetch(SB.url+'/auth/v1/token?grant_type=password',
          {method:'POST', headers:{'apikey':SB.anon,'Content-Type':'application/json'},
           body: JSON.stringify({email:emails[i], password:pw})});
        var jr = await r.json();
        if(r.ok && jr.access_token){ j = jr; loginEmail = emails[i]; break; }
      }catch(e2){}
    }
    if(!j) throw new Error(t('login_bad'));
    // MFA check for staff with 2FA
    var finalToken = j.access_token;
    try{ finalToken = await mfaCheckAndPrompt(loginEmail, j.access_token); }catch(mfaE){ showErr('lgErr', t('mfa_badcode')); if(btn){btn.disabled=false;btn.textContent=t('login_btn');} return false; }
    SB.token = finalToken;
    sessionStorage.setItem('kin_token', finalToken);
    if(j.refresh_token) sessionStorage.setItem('kin_refresh', j.refresh_token);
    sessionStorage.setItem('kin_uid', j.user.id);
    sessionStorage.setItem('kin_email', loginEmail);
    _curUser = await fetchProfile(j.user.id, loginEmail);
    _curUser._tok = finalToken;
    if(_curUser.role==='pending'){ showErr('lgErr', t('login_pending')); doLogout(); return false; }
    if(_curUser.role==='admin'){ try{ await mfaEmailCheck(); }catch(e2fa){ showErr('lgErr', t('mfa_badcode')); doLogout(); return false; } }
    // Gentle nudge: if password still default, show popup (not forced)
    var needsPwChange = await checkFirstLogin(_curUser);
    if(_curUser.role==='student' && _curUser.cnic){ location.hash = '#/student/'+_curUser.cnic; }
    else{
      // Check if first-time setup needed (admin, no students, no payment config)
      var needsSetup = await checkNeedsSetup(_curUser);
      if(needsSetup){ location.hash = '#/setup'; }
      else location.hash = sessionStorage.getItem('kin_lasttab') || '#/'+((_curUser.rights||[])[0]||'dash');
    }
    if(needsPwChange && location.hash!=='#/setup'){ setTimeout(function(){ showPwNudge(); }, 800); }
    // dashboard first, then silently preload every page's data in the background
    setTimeout(function(){ preloadAllPages(); }, 600);
  }catch(err){ showErr('lgErr', err.message||t('login_bad')); }
  if(btn){ btn.disabled = false; btn.textContent = t('login_btn'); }
  return false;
}

async function doFirstLogin(){
  var p1 = val('fl_pw1'), p2 = val('fl_pw2');
  if(!p1 || p1.length<6){ showErr('flErr', t('pw_short')); return; }
  if(p1!==p2){ showErr('flErr', t('pw_mismatch')); return; }
  var u = _curUser;
  try{
    // Update auth password
    try{ await refreshSession(); }catch(e){}
    var r = await fetch(SB.url+'/auth/v1/user', {method:'PUT',
      headers:{'apikey':SB.anon,'Authorization':'Bearer '+(SB.token||''),'Content-Type':'application/json'},
      body: JSON.stringify({password:p1})});
    if(!r.ok) throw new Error('pw_fail');
    // Mark pwChanged + save security question for students
    if(u.role==='student' && u.cnic){
      var s = await DB.get('students', u.cnic);
      if(s){
        s.pwChanged = true;
        var sq = val('fl_sq'), sa = val('fl_sa').trim().toLowerCase();
        if(sq && sa){ s.secQ = sq; s.secA = btoa(unescape(encodeURIComponent(sa))); }
        await DB.put('students', s);
      }
      location.hash = '#/student/'+u.cnic;
    } else {
      await setSetting('pwok_'+(u.uid||u.id),'1');
      location.hash = '#/dash';
    }
    toast(t('pw_done'));
  }catch(e){ showErr('flErr', t('pw_fail')); }
}

/* ---------- dashboard ---------- */
var _duesMap = null, _duesMapTs = 0;
async function duesMap(){
  // single-pass: build {cnic: dues} for ALL students in O(challans)
  if(_duesMap && (Date.now()-_duesMapTs) < 300000) return _duesMap;
  var ch = await DB.all('challans'), m = {};
  for(var i=0;i<ch.length;i++){
    var c = ch[i], bal = (Number(c.amount)||0)-(Number(c.paid)||0);
    if(bal>0) m[c.cnic] = (m[c.cnic]||0)+bal;
  }
  _duesMap = m; _duesMapTs = Date.now();
  return m;
}
async function duesOf(cnic){
  var m = await duesMap();
  return m[cnic]||0;
}

async function addSession(){

async function toggleSes(id){ var x=await DB.get('sessions',id); if(x){ x.active=!x.active; await DB.put('sessions',x); render(); } }
async function delStudent(cnic){
  if(!confirm(t('s_confirm_del'))) return;
  var ch = await DB.byIndex('challans','byStudent',cnic);
  for(var i=0;i<ch.length;i++){ var ps=await DB.byIndex('payments','byChallan',ch[i].id); for(var j=0;j<ps.length;j++) await DB.del('payments',ps[j].id); await DB.del('challans',ch[i].id); }

async function saveStudent(isNew, oldCnic){
  var d = { name:val('f_name'), father:val('f_father'), gender:val('f_gender'), dob:val('f_dob'),
    cnic:val('f_cnic').replace(/\D/g,''), phone:val('f_phone').replace(/\D/g,''), wa:val('f_wa').replace(/\D/g,''),
    email:val('f_email'), district:val('f_dist'), addr:val('f_addr'), qual:val('f_qual'), board:val('f_board'),
    marks:val('f_marks'), year:val('f_year'), program:val('f_prog'), status:val('f_status'), adm:val('f_adm')||today(),
    session:val('f_session'), roll:val('f_roll'), csys:val('f_csys'),
    sno:val('f_sno'), domicile:val('f_domicile'), ssc:val('f_ssc'), hssc:val('f_hssc'), shift:val('f_shift'),
    examReg:val('f_examreg'), duration:val('f_duration'), remarks:val('f_remarks'),
    fee:{adm:num('f_fadm'),monthly:num('f_fmon'),reg:num('f_freg'),exam:num('f_fexam'),fine:num('f_ffine'),other:num('f_fother')},
    photo:_photoData||'' };
  var errs = [];
  if(d.name.length<3) errs.push(t('f_name')+': min 3 chars');
  if(d.father.length<3) errs.push(t('f_father')+': min 3 chars');
  if(d.gender!=='M'&&d.gender!=='F') errs.push(t('f_gender')+': select M/F');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.dob)) errs.push(t('f_dob')+': use YYYY-MM-DD');
  if(d.cnic.length!==13) errs.push(t('f_cnic')+': must be 13 digits');
  if(!(d.phone.length===11&&d.phone.indexOf('03')===0)) errs.push(t('f_phone')+': 11 digits starting with 03');
  if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) errs.push(t('f_email')+': invalid format');
  if(d.district.length<2) errs.push(t('f_dist')+': required');
  if(d.addr.length<10) errs.push(t('f_addr')+': min 10 characters');
  if(!d.qual) errs.push(t('f_qual')+': required');
  if(!d.board) errs.push(t('f_board')+': required');
  if(!(parseFloat(d.marks)>=0&&parseFloat(d.marks)<=100)) errs.push(t('f_marks')+': 0-100 (enter percentage, not raw marks)');
  if(!/^\d{4}$/.test(d.year)) errs.push(t('f_year')+': 4-digit year');
  if(!d.program) errs.push(t('f_prog')+': select a program');
  if(!(d.fee.adm>0)) errs.push(t('p_admfee')+': required');
  if(!(d.fee.monthly>0)) errs.push(t('p_monfee')+': required');
  if(!(d.fee.reg>0)) errs.push(t('p_regfee')+': required');
  if(!(d.fee.exam>0)) errs.push(t('p_examfee')+': required');
  if(errs.length){ showErr('stErr', errs.join('<br>')); return; }
  var ex = await DB.get('students', d.cnic);
  if(ex && (isNew || d.cnic!==oldCnic)){ showErr('stErr', t('f_dup')); return; }
  if(isNew && !d.roll && d.session){ d.roll = await nextRoll(d.session); }
  if(!isNew && d.cnic!==oldCnic){
    // CNIC changed: move challans/payments to new key
    var chs = await DB.byIndex('challans','byStudent',oldCnic);
    await DB.del('students', oldCnic);
    for(var i=0;i<chs.length;i++){ chs[i].cnic=d.cnic; await DB.put('challans',chs[i]);
      var ps=await DB.byIndex('payments','byChallan',chs[i].id); for(var j=0;j<ps.length;j++){ ps[j].cnic=d.cnic; await DB.put('payments',ps[j]); } }
  }
  await DB.put('students', d);
  provisionStudentLogin(d.cnic, d.phone);
  location.hash = '#/student/'+d.cnic;
}
async function provisionStudentLogin(cnic, phone){
  try{
    var cc = String(cnic||'').replace(/\D/g,''), ph = String(phone||'').replace(/\D/g,'');
    if(cc.length!==13 || ph.length<6) return;
    await fetch(SB.url+'/auth/v1/signup', {method:'POST',
      headers:{'apikey':SB.anon,'Content-Type':'application/json'},
      body: JSON.stringify({email: studentEmail(cc), password: ph})});
  }catch(e){ /* already exists or offline: login will fail gracefully later */ }
}

/* ---------- student 360 profile ---------- */
function monthsInSession(adm){
  if(!adm || !/^\d{4}-\d{2}-\d{2}$/.test(adm)) return 0;
  var a=new Date(adm+'T00:00:00'), n=new Date();
  var m=(n.getFullYear()-a.getFullYear())*12+(n.getMonth()-a.getMonth())-(n.getDate()<a.getDate()?1:0);
  if(m<0) return 0;
  return m===0?1:m;
}
function durTxt(m){
  var y=Math.floor(m/12), r=m%12, p=[];
  if(y) p.push(y+' '+(y===1?t('p_year'):t('p_years')));
  if(r||!y) p.push(r+' '+(r===1?t('p_month'):t('p_months')));
  return p.join(' ');
}

async function genMonthly(){
  var sesId = val('gm_ses'), hid = Number(val('gm_head'));
  if(!sesId || !hid){ toast(t('f_bad')); return; }
  var head=null, heads=await DB.all('feeHeads');
  for(var i=0;i<heads.length;i++) if(heads[i].id===hid) head=heads[i];
  if(!head) return;
  var m = ym(today()), students = await DB.all('students'), n=0;
  for(var j=0;j<students.length;j++){
    var s=students[j];
    if(String(s.session)!==String(sesId) || s.status!=='active' || s.program!==head.program) continue;
    var ex = await DB.byIndex('challans','byStudent',s.cnic), dup=false;
    for(var k=0;k<ex.length;k++) if(ex[k].headId===hid && ex[k].month===m && ex[k].status!=='paid') dup=true;
    if(dup) continue;
    var no = await nextNo('CH','chCounter');
    var iAmt = (s.fee && +s.fee.monthly>0) ? +s.fee.monthly : head.amount;
    await DB.put('challans',{no:no,cnic:s.cnic,headId:hid,program:head.program,title:head.title,amount:iAmt,paid:0,due:today(),status:'unpaid',created:today(),sname:s.name,kind:'fee',month:m});
    n++;
    // auto-queue SMS fee reminder
    var L = LANG==='ur'?'ur':'en';
    var tmpl = _smsTemplates.fee[L]||_smsTemplates.fee.en;
    var msg = tmpl.replace('{name}',s.name||'').replace('{dues}',fmt(iAmt)).replace('{program}',progName(s.program)).replace('{date}',today());
    if(s.phone) await DB.put('sms',{to:s.phone, message:msg, status:'pending', created_at:new Date().toISOString(), by:'auto', template:'fee'});
  }
  toast(t('fee_gen_done')+': '+n); render();
}

async function savePayment(chId, bal){
  var c0 = await DB.get('challans',chId); if(!c0) return;
  if(!(Number(bal)>0)) bal = Number(c0.amount)-Number(c0.paid);
  var amt = Number(val('pay_amt').replace(/,/g,''));
  if(!(amt>0) || amt>bal){ showErr('payErr', t('f_bad')); return; }
  var recNo = await nextNo('REC','recCounter');
  var c = c0;
  var now = new Date();
  var pid = null;
  try{
    pid = await DB.put('payments',{recNo:recNo,challanId:chId,cnic:c.cnic,amount:amt,date:val('pay_date')||today(),time:now.toTimeString().slice(0,8),timestamp:now.toISOString(),method:val('pay_method'),head:val('pay_head'),by:val('pay_by')});
    c.paid = Number(c.paid)+amt;
    c.status = c.paid>=Number(c.amount) ? 'paid' : 'partial';
    await DB.put('challans',c);
  }catch(e){
    // rollback: remove orphaned payment if challan update failed
    if(pid){ try{ await DB.del('payments',pid); }catch(_){} }
    showErr('payErr', t('pay_fail_retry'));
    return;
  }
  toast(t('msg_saved'));
  printReceipt(pid);
}

async function printReceipt(pid){
  await warmStuCache();
  var p = await DB.get('payments',pid); if(!p) return;
  var c = await DB.get('challans',p.challanId);
  var s = await DB.get('students',p.cnic);

    var rows = '';

    for(var i=0;i<heads.length;i++){

async function vAudit(){
  var rows = await DB.req('GET','/rest/v1/audit_log?select=id,created_at,user_id,user_role,action,table_name,record_id,details&order=id.desc&limit=200');
  rows = rows||[];
  function actBadge(a){
    var c = a==='INSERT'?'var(--g)':a==='DELETE'?'var(--red)':'var(--amber)';
    return '<span class="badge" style="background:'+c+'1a;color:'+c+';border:1px solid '+c+'40">'+a+'</span>';
  }
  var tr = rows.map(function(x){
    var d = x.details||{};
    var who = esc(x.user_role||'-')+' <span class="mut">'+esc((x.user_id||'').slice(0,8))+'</span>';
    var what = actBadge(esc(x.action))+' '+esc(x.table_name)+(x.record_id?' <span class="mut">#'+esc(x.record_id)+'</span>':'');
    var det = '';
    try{
      var dd = typeof d==='string'?JSON.parse(d):d;
      var rec = (dd&&dd.new&&dd.new.data)||(dd&&dd.new)||(dd&&dd.old&&dd.old.data)||(dd&&dd.old)||{};
      if(rec && typeof rec==='object' && Object.keys(rec).length){
        var bits = [];
        if(rec.recNo) bits.push('<b dir="ltr" style="color:var(--g)">'+esc(rec.recNo)+'</b>');
        if(rec.name) bits.push('<b>'+esc(rec.name)+'</b>');
        if(rec.amount!=null) bits.push('Rs '+fmt(rec.amount));
        if(rec.cnic) bits.push('<span dir="ltr" class="mut">'+esc(rec.cnic)+'</span>');
        if(rec.title) bits.push(esc(rec.title));
        if(rec.no) bits.push('<span dir="ltr" class="mut">'+esc(rec.no)+'</span>');
        if(rec.date && rec.status) bits.push(esc(rec.date)+' &mdash; <b>'+esc(rec.status)+'</b>'+(rec.ref?' <span dir="ltr" class="mut">'+esc(rec.ref)+'</span>':''));
        if(rec.method) bits.push(esc(methodName(rec.method)));
        det = bits.length ? bits.join(' &middot; ') : esc(JSON.stringify(rec).slice(0,100));
      }
    }catch(e){}
    return '<tr><td dir="ltr" style="white-space:nowrap">'+esc(x.created_at||'').slice(0,19).replace('T',' ')+'</td><td>'+who+'</td><td>'+what+'</td><td style="font-size:12px">'+det+'</td></tr>';
  }).join('');
  return '<div class="card"><h2>'+t('nav_audit')+'</h2><p class="mut">'+t('audit_sub')+'</p>'
    +'<div class="tblwrap"><table class="tbl"><tr><th>'+t('audit_when')+'</th><th>'+t('audit_who')+'</th><th>'+t('audit_what')+'</th><th>'+t('audit_detail')+'</th></tr>'
    +(tr||'<tr><td colspan="4" class="mut">'+t('audit_empty')+'</td></tr>')+'</table></div></div>';
}

async function backupJSON(){
  var data={};
  var stores=['students','feeHeads','challans','payments','settings','sessions','employees','attendance','expenses','subjects','timetable','exams','examstu','marks','letters','hospitals','trainees','visitors','events','problems','cvs','books','bookissue','stockcats','stock'];

  for(var i=0;i<stores.length;i++) data[stores[i]]=allData[i];
  data._meta={app:'kin-mis',v:1,date:today()};
  return JSON.stringify(data);
}
function downloadFile(name,text,mime){
  var b=new Blob([text],{type:mime||'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},4000);
}
async function exportBackup(){ downloadFile('kin-backup-'+today()+'.json', await backupJSON()); showOk('bakOk',t('bak_done')); }
function b64enc(u8){ var s=''; for(var i=0;i<u8.length;i+=8192) s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return btoa(s); }
function b64dec(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function encKey(pass,salt){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encBackup(pass){
  var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  var key=await encKey(pass,salt);
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(await backupJSON())));
  var out=new Uint8Array(28+ct.length); out.set(salt,0); out.set(iv,16); out.set(ct,28);
  return b64enc(out);
}
async function decBackup(enc,pass){
  var raw=b64dec(enc), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  var key=await encKey(pass,salt);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function importBackup(inp){
  var f=inp.files[0]; if(!f) return;
  try{
    var text=await f.text(), data=null;
    try{ data=JSON.parse(text); }catch(e){
      var pass=prompt('Backup password:'); if(!pass){ inp.value=''; return; }
      data=await decBackup(text,pass);
    }
    if(!data || !data._meta || data._meta.app!=='kin-mis') throw new Error('bad file');
    if(!confirm(t('bak_confirm'))){ inp.value=''; return; }
    var stores=['students','feeHeads','challans','payments','settings','sessions','employees','attendance','expenses'];
    for(var i=0;i<stores.length;i++){ await DB.clear(stores[i]); var rs=data[stores[i]]||[]; for(var j=0;j<rs.length;j++) await DB.put(stores[i],rs[j]); }
    await ensureAuth(); _stuCache={};
    showOk('bakOk',t('bak_restored'));
  }catch(err){ showErr('bakErr', 'Restore failed: '+err.message); }
  inp.value='';
}
/* google drive (lazy-loaded; needs internet + client id in settings) */
function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
var driveToken=null;
async function driveAuth(){
  var cid=(await setting('driveClientId','')).trim();
  if(!cid){ alert(t('bak_need')); go('settings'); return null; }
  if(!navigator.onLine){ alert(t('bak_offline')); return null; }
  try{
    if(!window.google) await loadScript('https://accounts.google.com/gsi/client');
    var tok=await new Promise(function(res,rej){
      try{
        var tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file',
          callback:function(r){ if(r.access_token) res(r.access_token); else rej(new Error('auth')); },
          error_callback:function(){ rej(new Error('auth')); }});
        tc.requestAccessToken();
      }catch(e){ rej(e); }
    });
    driveToken=tok;
    var el=document.getElementById('drvStat'); if(el) el.textContent='✓ Google Drive';
    return tok;
  }catch(e){ alert('Drive sign-in failed.'); return null; }
}
async function driveBackupNow(){
  var tok=driveToken||await driveAuth(); if(!tok) return;
  var pass=await setting('bakPass','');
  if(!pass){ alert('Set a backup password in Settings first.'); go('settings'); return; }
  try{
    var enc=await encBackup(pass);
    var meta={name:'kin-backup-'+today()+'.kinbak',mimeType:'application/octet-stream'};
    var fd=new FormData();
    fd.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
    var raw=b64dec(enc); fd.append('file',new Blob([raw],{type:'application/octet-stream'}));
    var r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+tok},body:fd});
    if(!r.ok) throw new Error('upload '+r.status);
    showOk('bakOk',t('bak_ok'));
  }catch(e){ showErr('bakErr','Drive upload failed: '+e.message); }
}

async function mfaCheckAndPrompt(email, access_token){
  var phone = await setting('mfa_'+email, '');
  if(!phone) return access_token; // 2FA not enabled
  var code = mfaGenCode();
  _mfaCodes[email] = {code: code, expires: Date.now()+5*60*1000};
  // queue SMS with the code
  await DB.put('sms', {to: phone, message: 'Your KIN login code is: '+code+'. Valid for 5 minutes.', status:'pending', created_at:new Date().toISOString(), by:'2fa', template:'2fa'});
  // try to send immediately if gateway/modem available
  if(SMSGateway.url) SMSGateway.processQueue();
  else if(Modem.connected) Modem.processQueue();
  var userCode = prompt(t('mfa_enter')+'\n'+t('mfa_sent_to')+' '+phone);
  if(!userCode) throw new Error('cancelled');
  var stored = _mfaCodes[email];
  delete _mfaCodes[email];
  if(!stored || Date.now()>stored.expires || userCode.replace(/\D/g,'')!==stored.code) throw new Error('bad code');
  return access_token;
}

/* ---------- SMS modem via Web Serial ---------- */
var Modem = {
  port:null, reader:null, writer:null, connected:false, sending:false,
  log:[],
  mlog:function(m){ Modem.log.push(new Date().toLocaleTimeString()+' '+m); if(Modem.log.length>50)Modem.log.shift(); var el=document.getElementById('mdmLog'); if(el) el.innerHTML = Modem.log.map(function(x){return '<div>'+esc(x)+'</div>';}).join(''); },
  isUCS2:function(msg){ for(var i=0;i<msg.length;i++){ var c=msg.charCodeAt(i); if(c>127) return true; } return false; },
  strToUCS2:function(s){ var out=''; for(var i=0;i<s.length;i++){ var hx=s.charCodeAt(i).toString(16); while(hx.length<4)hx='0'+hx; out+=hx.toUpperCase(); } return out; },
  connect:async function(){
    if(!('serial' in navigator)){ Modem.mlog('Web Serial not supported. Use Chrome or Edge.'); return false; }
    try{
      Modem.port = await navigator.serial.requestPort();
      await Modem.port.open({baudRate:115200});
      var enc = new TextEncoder();
      Modem.writer = Modem.port.writable.getWriter();
      Modem.reader = Modem.port.readable.getReader();
      var r = await Modem.cmd('AT', 3000);
      if(r.indexOf('OK')<0) throw new Error('no response');
      await Modem.cmd('AT+CMGF=1');
      Modem.connected = true;
      Modem.mlog('Modem connected.');
      updateMdmUI();
      return true;
    }catch(e){ Modem.mlog('Connect failed: '+(e.message||e)); return false; }
  },
  disconnect:async function(){
    try{ if(Modem.reader) await Modem.reader.cancel(); if(Modem.writer) Modem.writer.releaseLock(); if(Modem.port) await Modem.port.close(); }catch(e){}
    Modem.connected=false; Modem.port=null; Modem.mlog('Disconnected.'); updateMdmUI();
  },
  cmd:function(c, timeout){
    var self=this;
    return new Promise(async function(res){
      timeout = timeout||5000;
      var buf='';
      var enc = new TextEncoder(), dec = new TextDecoder();
      await self.writer.write(enc.encode(c+'\r'));
      var to = setTimeout(function(){ res(buf); }, timeout);
      try{
        while(true){
          var r = await self.reader.read();
          if(r.done) break;
          buf += dec.decode(r.value);
          if(buf.indexOf('OK')>=0 || buf.indexOf('ERROR')>=0){ clearTimeout(to); res(buf); break; }
        }
      }catch(e){ clearTimeout(to); res(buf); }
    });
  },
  sendSMS:async function(phone, message){
    var self=this, enc=new TextEncoder(), dec=new TextDecoder();
    phone = String(phone).replace(/[^+\d]/g,'');
    if(phone.charAt(0)!=='+') phone = '+92'+phone.replace(/^0/,'');
    var ucs2 = self.isUCS2(message);
    try{
      if(ucs2){
        await self.cmd('AT+CSCS="UCS2"');
        await self.cmd('AT+CSMP=17,167,0,8');
        var pduPhone = self.strToUCS2(phone);
        await self.writer.write(enc.encode('AT+CMGS="'+pduPhone+'"\r'));
        await new Promise(function(r){setTimeout(r,500);});
        var hexMsg = self.strToUCS2(message);
        await self.writer.write(enc.encode(hexMsg));
        await self.writer.write(new Uint8Array([26]));
        var resp = await new Promise(async function(res){
          var buf='', to=setTimeout(function(){res(buf);},15000);
          try{ while(true){ var rd=await self.reader.read(); if(rd.done)break; buf+=dec.decode(rd.value); if(buf.indexOf('+CMGS')>=0||buf.indexOf('ERROR')>=0){clearTimeout(to);res(buf);break;} } }catch(e){clearTimeout(to);res(buf);}
        });
        return resp.indexOf('+CMGS')>=0;
      }else{
        await self.cmd('AT+CSCS="GSM"');
        await self.writer.write(enc.encode('AT+CMGS="'+phone+'"\r'));
        await new Promise(function(r){setTimeout(r,500);});
        await self.writer.write(enc.encode(message));
        await self.writer.write(new Uint8Array([26]));
        var resp2 = await new Promise(async function(res){
          var buf='', to=setTimeout(function(){res(buf);},15000);
          try{ while(true){ var rd=await self.reader.read(); if(rd.done)break; buf+=dec.decode(rd.value); if(buf.indexOf('+CMGS')>=0||buf.indexOf('ERROR')>=0){clearTimeout(to);res(buf);break;} } }catch(e){clearTimeout(to);res(buf);}
        });
        return resp2.indexOf('+CMGS')>=0;
      }
    }catch(e){ Modem.mlog('Send error: '+(e.message||e)); return false; }
  },
  processQueue:async function(){
    if(Modem.sending || !Modem.connected) return;
    Modem.sending = true;
    try{
      // recover messages stuck in 'sending' from crashed sessions
      var stuck = await DB.req('GET','/rest/v1/sms_outbox?select=id,data&data->>status=eq.sending');
      for(var si=0;si<(stuck||[]).length;si++){
        var sd = stuck[si].data||{}; sd.status = 'pending';
        await DB.req('PATCH','/rest/v1/sms_outbox?id=eq.'+stuck[si].id, {data:sd});
      }
      var pending = await DB.req('GET','/rest/v1/sms_outbox?select=id,data&data->>status=eq.pending&order=id.asc&limit=10');
      for(var i=0;i<pending.length;i++){
        var row = pending[i], d = row.data||{};
        Modem.mlog('Sending to '+d.to+'...');
        d.status = 'sending';
        await DB.req('PATCH','/rest/v1/sms_outbox?id=eq.'+row.id, {data:d});
        var ok = await Modem.sendSMS(d.to, d.message);
        d.status = ok?'sent':'failed';
        d.sent_at = new Date().toISOString();
        if(!ok) d.error = 'modem rejected';
        await DB.req('PATCH','/rest/v1/sms_outbox?id=eq.'+row.id, {data:d});
        Modem.mlog((ok?'Sent ✓ ':'Failed ✗ ')+d.to);
        updateMdmUI();
        await new Promise(function(r){setTimeout(r,2000);});
      }
    }catch(e){ Modem.mlog('Queue error: '+(e.message||e)); }
    Modem.sending = false;
    updateMdmUI();
  }
};
function updateMdmUI(){
  var s = document.getElementById('mdmStatus');
  if(s) s.innerHTML = Modem.connected ? '<span class="badge b-paid">Connected</span>' : '<span class="badge b-unpaid">Disconnected</span>';
  var b = document.getElementById('mdmBtn');
  if(b) b.textContent = Modem.connected ? t('sms_disconnect') : t('sms_connect');
}
/* ---------- end modem ---------- */

/* ---------- SMS HTTP gateway (Android phone) ---------- */
var SMSGateway = {
  url: localStorage.getItem('sms_gw_url')||'',
  mode: localStorage.getItem('sms_gw_mode')||'get',
  delay: parseInt(localStorage.getItem('sms_gw_delay')||'3'),
  sending:false,
  save:function(){
    SMSGateway.url = document.getElementById('gwUrl').value.trim();
    SMSGateway.mode = document.getElementById('gwMode').value;
    SMSGateway.delay = parseInt(document.getElementById('gwDelay').value)||3;
    localStorage.setItem('sms_gw_url', SMSGateway.url);
    localStorage.setItem('sms_gw_mode', SMSGateway.mode);
    localStorage.setItem('sms_gw_delay', SMSGateway.delay);
    toast(t('msg_saved'));
  },
  sendOne:async function(phone, message){
    var base = SMSGateway.url.replace(/\/$/,'');
    phone = String(phone).replace(/[^+\d]/g,'');
    try{
      var r;
      if(SMSGateway.mode==='get'){
        var u = base+'/sendsms?phone='+encodeURIComponent(phone)+'&text='+encodeURIComponent(message);
        r = await fetch(u, {mode:'no-cors'});
        return true; // no-cors can't read response, assume sent
      }else{
        r = await fetch(base+'/send', {method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({phone:phone, message:message})});
        return r.ok;
      }
    }catch(e){ return false; }
  },
  processQueue:async function(){
    if(SMSGateway.sending) return;
    if(!SMSGateway.url){ toast(t('sms_gw_nourl')); return; }
    SMSGateway.sending = true;
    var done=0, fail=0;
    try{
      var stuck2 = await DB.req('GET','/rest/v1/sms_outbox?select=id,data&data->>status=eq.sending');
      for(var sj=0;sj<(stuck2||[]).length;sj++){
        var sd2 = stuck2[sj].data||{}; sd2.status = 'pending';
        await DB.req('PATCH','/rest/v1/sms_outbox?id=eq.'+stuck2[sj].id, {data:sd2});
      }
      while(true){
        var rows = await DB.req('GET','/rest/v1/sms_outbox?select=id,data&data->>status=eq.pending&order=id.asc&limit=5');
        if(!rows.length) break;
        for(var i=0;i<rows.length;i++){
          var row=rows[i], d=row.data||{};
          d.status='sending';
          await DB.req('PATCH','/rest/v1/sms_outbox?id=eq.'+row.id,{data:d});
          var ok = await SMSGateway.sendOne(d.to, d.message);
          d.status = ok?'sent':'failed';
          d.sent_at = new Date().toISOString();
          d.via = 'gateway';
          if(!ok) d.error='gateway failed';
          await DB.req('PATCH','/rest/v1/sms_outbox?id=eq.'+row.id,{data:d});
          if(ok)done++; else fail++;
          var pr = document.getElementById('gwProg');
          if(pr) pr.textContent = done+' sent, '+fail+' failed';
          await new Promise(function(r){setTimeout(r, SMSGateway.delay*1000);});
        }
        render();
      }
    }catch(e){}
    SMSGateway.sending=false;
    toast(done+' sent, '+fail+' failed');
  },
  test:async function(){
    var n = document.getElementById('gwTestNum').value.replace(/\D/g,'');
    if(!n || !SMSGateway.url) return;
    var ok = await SMSGateway.sendOne(n, 'Test SMS from Khalil Institute MIS.');
    toast(ok?'Sent (check phone)':'Failed - check URL and app');
  }
};

function attDateChg(){ _attDate = val('att_date')||today(); _attBuf={}; render(); }
async function attSave(kind){
  var d = val('att_date')||today();
  var old = await DB.byIndex('attendance','byDate',d);
  for(var i=0;i<old.length;i++) if(old[i].kind===kind) await DB.del('attendance',old[i].id);
  var n=0, absentCount=0;
  var stuMap = {};
  if(kind==='stu'){
    var allStu = await DB.all('students');
    for(var si=0;si<allStu.length;si++) stuMap[allStu[si].cnic] = allStu[si];
  }
  for(var ref in _attBuf){
    await DB.put('attendance',{date:d,kind:kind,ref:ref,status:_attBuf[ref]}); n++;
    // queue absence SMS for absent students
    if(kind==='stu' && _attBuf[ref]==='A'){
      var st = stuMap[ref];
      if(st && st.phone){
        var L = LANG==='ur'?'ur':'en';
        var tmpl = _smsTemplates.absent[L]||_smsTemplates.absent.en;
        var msg = tmpl.replace('{name}',st.name||'').replace('{date}',d);
        await DB.put('sms',{to:st.phone, message:msg, status:'pending', created_at:new Date().toISOString(), by:'auto', template:'absent'});
        absentCount++;
      }
    }
  }
  toast(t('at_saved')+': '+n+(absentCount?' ('+absentCount+' SMS)':''));
  _attBuf={};
}
async function attSummary(kind){
  var m = val('att_m')||ym(today());

  var agg = {};
  for(var i=0;i<all.length;i++){ var a=all[i]; if(a.kind!==kind||ym(a.date)!==m) continue;
    agg[a.ref]=agg[a.ref]||{P:0,A:0,L:0}; agg[a.ref][a.status]++; }
  var names = {};
  if(kind==='stu') await warmStuCache();
  else { var es=await DB.all('employees'); for(var j=0;j<es.length;j++) names[es[j].cnic]=es[j].name; }
  var rows = Object.keys(agg).map(function(ref){
    var nm = kind==='stu' ? stuName(ref) : (names[ref]||ref);
    var g=agg[ref], tot=g.P+g.A+g.L;
    var nmCell2 = kind==='stu' ? stuLink(ref, nm) : esc(nm);
    return '<tr><td>'+nmCell2+'</td><td dir="ltr">'+esc(ref)+'</td><td style="text-align:center">'+g.P+'</td><td style="text-align:center">'+g.A+'</td><td style="text-align:center">'+g.L+'</td><td style="text-align:center">'+tot+'</td></tr>';
  }).join('');

async function qcSearch(){

  await warmStuCache();

  document.getElementById('qcResults').innerHTML = m.map(function(s){
    return '<button class="btn gh sm" style="margin:4px" onclick="qcPick(\''+s.cnic+'\')">'+esc(s.name)+' <span dir="ltr">'+esc(s.cnic)+'</span></button>';
  }).join('') || '<p class="mut">'+t('s_nor')+'</p>';
  document.getElementById('qcDues').innerHTML='';
}
async function qcPick(cnic){
  _qcStu = cnic;
  document.getElementById('qcResults').innerHTML='';
  var ch = await DB.byIndex('challans','byStudent',cnic);
  var dues = ch.filter(function(c){ return Number(c.amount)-Number(c.paid) > 0; });
  dues.sort(function(a,b){ return a.due<b.due?-1:1; });
  var s = await DB.get('students',cnic);
  var tot=0;
  var rows = dues.map(function(c){
    var b = Number(c.amount)-Number(c.paid); tot+=b;
    return '<tr><td><input type="checkbox" class="qc_chk" value="'+c.id+'" checked style="width:20px;height:20px"></td><td>'+esc(c.no)+'</td><td>'+esc(c.title)+'</td><td dir="ltr">'+esc(c.due)+'</td><td style="text-align:right">'+fmt(b)+'</td><td><input type="number" class="qc_amt" data-cid="'+c.id+'" value="'+b+'" min="1" max="'+b+'" style="width:100px" dir="ltr"></td></tr>';
  }).join('');
  document.getElementById('qcDues').innerHTML = '<h3 class="mt">'+stuLink(s.cnic,s.name)+' — '+t('fee_dues')+': '+t('cmn_rs')+' '+fmt(tot)+'</h3>'
  +(dues.length? '<div style="overflow-x:auto"><table class="tbl"><tr><th>'+t('cmn_actions')+'</th><th>'+t('fee_no')+'</th><th>'+t('fee_head')+'</th><th>'+t('fee_due')+'</th><th style="text-align:right">'+t('fee_total_due')+'</th></tr>'+rows+'</table></div>'
  +'<div class="f2 mt"><div class="frow"><label>'+t('fee_method')+'</label><select id="qc_method"><option value="cash">'+t('fee_cash')+'</option><option value="bank">'+t('fee_bank')+'</option><option value="jazz">'+t('fee_jazz')+'</option><option value="easy">'+t('fee_easy')+'</option></select></div>'
  +'<div class="frow"><label>'+t('fee_type')+'</label><select id="qc_head">'+headOpts('tuition')+'</select></div></div>'
  +'<div class="frow" style="max-width:260px"><label>'+t('fee_date')+'</label><input type="date" id="qc_date" value="'+today()+'"></div>'
  +'<p class="mt"><button class="btn gold" onclick="qcCollect()">'+t('qc_collect')+'</button></p>'
  : '<p class="mut">'+t('fee_nodues')+'</p>');
}
async function qcCollect(){
  var checks = Array.prototype.slice.call(document.querySelectorAll('.qc_chk')).filter(function(c){return c.checked;});
  if(!checks.length){ toast(t('f_bad')); return; }
  var method=val('qc_method'), head=val('qc_head'), date=val('qc_date')||today(), tot=0, n=0;
  for(var i=0;i<checks.length;i++){
    var cid = Number(checks[i].value);
    var c = await DB.get('challans',cid); if(!c) continue;
    var bal = Number(c.amount)-Number(c.paid); if(bal<=0) continue;
    var amtInp = document.querySelector('.qc_amt[data-cid="'+cid+'"]');
    var amt = amtInp ? Number(amtInp.value)||bal : bal;
    if(amt<=0 || amt>bal) amt = bal;
    var recNo = await nextNo('REC','recCounter');
    var now = new Date();
    try{
      var pid = await DB.put('payments',{recNo:recNo,challanId:c.id,cnic:c.cnic,amount:amt,date:date,time:now.toTimeString().slice(0,8),timestamp:now.toISOString(),method:method,head:head,by:''});
      c.paid = Number(c.paid)+amt;
      c.status = c.paid>=Number(c.amount) ? 'paid' : 'partial';
      await DB.put('challans',c);
      tot+=amt; n++;
    }catch(e){
      if(pid){ try{ await DB.del('payments',pid); }catch(_){} }
    }
  }
  toast(t('qc_done')+': '+t('cmn_rs')+' '+fmt(tot)+' ('+n+')');
  if(n>0){ var lastPid = null; try{ var ps = await DB.all('payments'); if(ps.length) lastPid = ps[ps.length-1].id; }catch(e){} if(lastPid) setTimeout(function(){printReceipt(lastPid);},500); }
  if(_qcStu) qcPick(_qcStu); else render();
}

async function saveMarks(examId){
  var e = await DB.get('exams',examId);
  var inps = document.querySelectorAll('.mk_inp');
  var mk = await DB.byIndex('marks','byExam',examId);
  var ex = {};
  mk.forEach(function(m){ ex[m.cnic+'|'+m.sid]=m; });
  for(var i=0;i<inps.length;i++){
    var cnic=inps[i].getAttribute('data-cnic'), sid=Number(inps[i].getAttribute('data-sid'));
    var v=inps[i].value.trim();
    var key=cnic+'|'+sid;
    if(v===''){ if(ex[key]) await DB.del('marks',ex[key].id); continue; }
    var obt=Number(v); if(!(obt>=0)) continue;
    // cap at total
    var tot=100; for(var j=0;j<e.subjects.length;j++) if(e.subjects[j].sid===sid) tot=e.subjects[j].marks;
    if(obt>tot) obt=tot;
    if(ex[key]){ ex[key].obt=obt; await DB.put('marks',ex[key]); }
    else await DB.put('marks',{examId:examId,cnic:cnic,sid:sid,obt:obt});
  }
  toast(t('msg_saved'));
}

async function vResult(examId){

  function subName(sid){ for(var i=0;i<subs.length;i++) if(subs[i].id===sid) return subs[i].name; return ''; }
  await warmStuCache();
  var totalMax = e.subjects.reduce(function(a,s){return a+s.marks;},0);
  var mlookup = {};
  mk.forEach(function(m){ mlookup[m.cnic+'|'+m.sid]=m.obt; });
  var res = es.map(function(x){
    var tot=0, per=e.subjects.map(function(s){ var v=mlookup[x.cnic+'|'+s.sid]; v=(v===undefined?0:v); tot+=v; return v; });
    return {cnic:x.cnic, roll:x.roll, tot:tot, per:per, pct: totalMax? Math.round(tot/totalMax*100):0};
  });

  +'<h3 class="mt">'+t('ac_dmc')+'</h3><div style="overflow-x:auto"><table class="tbl"><tr><th>#</th><th>'+t('s_name')+'</th><th>'+t('s_cnic')+'</th>'+subHeads+'<th style="text-align:right">'+t('ac_total')+'</th><th style="text-align:right">%</th></tr>'+dmcRows+'</table></div></div>';

async function saveLetter(){

async function compartGo(){
  var examId = Number(val('cp_ex')); if(!examId) return;
  var e = await DB.get('exams',examId);
  var es = await DB.byIndex('examstu','byExam',examId);
  var mk = await DB.byIndex('marks','byExam',examId);
  var mlookup={}; mk.forEach(function(m){ mlookup[m.cnic+'|'+m.sid]=m.obt; });
  await warmStuCache();
  var passPct = 40;
  var rows = [];
  es.forEach(function(x){
    var fails=[];
    e.subjects.forEach(function(s){
      var v=mlookup[x.cnic+'|'+s.sid]; v=(v===undefined?0:v);
      if(v < s.marks*passPct/100) fails.push(s.sid);
    });
    if(fails.length) rows.push({x:x, fails:fails});
  });
  var subs = await DB.all('subjects');
  function subName(sid){ for(var i=0;i<subs.length;i++) if(subs[i].id===sid) return subs[i].name; return ''; }
  document.getElementById('cpOut').innerHTML = '<table class="tbl"><tr><th>'+t('s_roll')+'</th><th>'+t('s_name')+'</th><th>'+t('lt_compartsub')+'</th></tr>'
  +rows.map(function(r){ return '<tr><td>'+esc(r.x.roll)+'</td><td>'+esc(stuName(r.x.cnic))+'</td><td>'+r.fails.map(subName).map(esc).join(', ')+'</td></tr>'; }).join('')
  +'</table>'+(rows.length?'':'<p class="mut">'+t('cmn_none')+'</p>');

  var ex = await DB.all('exams');
  var opts = ex.map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>';}).join('');
  return '<div class="card"><h2>'+t('lt_grace')+'</h2><div class="f2"><div class="frow"><label>'+t('ac_exname')+'</label><select id="gr_ex" onchange="graceGo()">'+opts+'</select></div>'
  +'<div class="frow"><label>'+t('lt_gracemarks')+'</label><input id="gr_n" type="number" value="5" dir="ltr" onchange="graceGo()"></div></div><div id="grOut" class="mt"></div></div>';

async function graceGo(){
  var examId = Number(val('gr_ex')); if(!examId) return;
  var grace = Number(val('gr_n'))||0;
  var e = await DB.get('exams',examId);
  var es = await DB.byIndex('examstu','byExam',examId);
  var mk = await DB.byIndex('marks','byExam',examId);
  var mlookup={}; mk.forEach(function(m){ mlookup[m.cnic+'|'+m.sid]=m.obt; });
  await warmStuCache();
  var subs = await DB.all('subjects');
  function subName(sid){ for(var i=0;i<subs.length;i++) if(subs[i].id===sid) return subs[i].name; return ''; }
  var rows=[];
  es.forEach(function(x){
    e.subjects.forEach(function(s){
      var v=mlookup[x.cnic+'|'+s.sid]; v=(v===undefined?0:v);
      var need = Math.ceil(s.marks*0.4 - v);
      if(need>0 && need<=grace) rows.push({x:x, sid:s.sid, got:v, need:need});
    });
  });
  document.getElementById('grOut').innerHTML = '<table class="tbl"><tr><th>'+t('s_roll')+'</th><th>'+t('s_name')+'</th><th>'+t('ac_subject')+'</th><th style="text-align:right">'+t('ac_obt')+'</th><th style="text-align:right">'+t('lt_graceneed')+'</th></tr>'
  +rows.map(function(r){ return '<tr><td>'+esc(r.x.roll)+'</td><td>'+esc(stuName(r.x.cnic))+'</td><td>'+esc(subName(r.sid))+'</td><td style="text-align:right">'+r.got+'</td><td style="text-align:right">'+r.need+'</td></tr>'; }).join('')
  +'</table>'+(rows.length?'':'<p class="mut">'+t('cmn_none')+'</p>');
}

  function catName(id){ for(var i=0;i<cs.length;i++) if(cs[i].id===id) return cs[i].name; return ''; }
  var rows = items.map(function(x){
    return '<tr><td>'+esc(x.item)+'</td><td>'+esc(catName(x.catId))+'</td><td style="text-align:right">'+esc(x.qty)+'</td><td dir="ltr">'+esc(x.pdate||'')+'</td><td style="text-align:right">'+fmt(x.price||0)+'</td><td><button class="btn sm red" onclick="delStock('+x.id+')">×</button></td></tr>';
  }).join('');
  var cOpts = cs.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+'</option>'; }).join('');
  return '<div class="card"><h2>'+t('st_items')+'</h2><div class="err" id="stErr"></div>'
  +'<div class="f2"><div class="frow"><label>'+t('st_item')+'</label><input id="st_item"></div><div class="frow"><label>'+t('st_cats')+'</label><select id="st_cat">'+cOpts+'</select></div></div>'
  +'<div class="f2"><div class="frow"><label>'+t('st_qty')+'</label><input id="st_qty" type="number" value="1" dir="ltr"></div><div class="frow"><label>'+t('st_pdate')+'</label><input type="date" id="st_pdate" value="'+today()+'"></div></div>'
  +'<div class="frow" style="max-width:200px"><label>'+t('st_price')+'</label><input id="st_price" type="number" dir="ltr"></div>'
  +'<p class="mt"><button class="btn" onclick="addStock()">'+t('cmn_add')+'</button></p>'
  +'<div class="mt" style="overflow-x:auto"><table class="tbl"><tr><th>'+t('st_item')+'</th><th>'+t('st_cats')+'</th><th style="text-align:right">'+t('st_qty')+'</th><th>'+t('st_pdate')+'</th><th style="text-align:right">'+t('st_price')+'</th><th>'+t('cmn_actions')+'</th></tr>'+(rows||'<tr><td colspan="6" class="mut">'+t('cmn_none')+'</td></tr>')+'</table></div></div>';
}
async function addStock(){
  var n=val('st_item').trim(); if(n.length<2){ showErr('stErr',t('f_bad')); return; }
  await DB.put('stock',{item:n,catId:Number(val('st_cat'))||0,qty:Number(val('st_qty'))||1,pdate:val('st_pdate')||today(),price:Number(val('st_price'))||0});
  toast(t('msg_saved')); render();
}
async function delStock(id){ if(!confirm(t('cmn_cdel')))return; await DB.del('stock',id); render(); }


</script>
</body>
</html>
